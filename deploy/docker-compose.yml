services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - internal
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    restart: unless-stopped

  # Direct TLS ingress (no Cloudflare) so artifact uploads of any size work:
  # the Cloudflare proxy caps request bodies at 100 MB on the Free plan, so
  # large uploads must skip the tunnel entirely. Opt-in via the
  # "direct-ingress" profile -- the default stack is unchanged without it:
  #
  #   docker compose --profile direct-ingress up -d
  #
  # Requires CLOUDFLARE_DNS_API_TOKEN in the deploy .env (ACME DNS-01) plus a
  # DNS-only A record and a router port-forward -- see DIRECT-INGRESS.md.
  ingress:
    build:
      context: .
      dockerfile: Dockerfile.ingress
    profiles:
      - direct-ingress
    ports:
      - "${INGRESS_PORT:-8443}:8443"
    environment:
      - INGRESS_HOST=${INGRESS_HOST:-api.pazer.build}
      - INGRESS_UPSTREAM=${INGRESS_UPSTREAM:-buildhost-backend:8080}
      - INGRESS_ACME_EMAIL=${INGRESS_ACME_EMAIL:-hostmaster@pazer.build}
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    volumes:
      - ./Caddyfile.ingress:/etc/caddy/Caddyfile:ro
      # ACME account + issued certs live in /data so restarts never re-issue.
      - ingress-data:/data
      - ingress-config:/config
    networks:
      - internal
    restart: unless-stopped

  buildhost:
    image: ghcr.io/wow-look-at-my/buildhost:latest
    labels:
      docker-updater.enable: "true"
      docker-updater.rolling: "true"
    stop_grace_period: 5m
    volumes:
      - buildhost-data:/var/lib/buildhost
    environment:
      - BUILDHOST_BASE_URL=${BUILDHOST_BASE_URL}
    networks:
      internal:
        aliases:
          - buildhost-backend
    restart: unless-stopped

  docker-updater:
    image: ghcr.io/wow-look-at-my/docker-updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Share buildhost's network so the updater reaches it by DNS alias
    # (buildhost-backend) for pre-checks. No host networking required.
    networks:
      - internal
    restart: unless-stopped

volumes:
  buildhost-data:
  ingress-data:
  ingress-config:

networks:
  internal:
