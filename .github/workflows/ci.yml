name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write
  # Required by the publish-ghcr reusable workflow (it verifies actions:read to
  # download build artifacts). A reusable workflow cannot be granted more than
  # the caller declares, so omitting this makes the whole run a startup_failure.
  actions: read

jobs:
  build:
    runs-on: wow-linux
    permissions:
      id-token: write
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      # The CA bundle baked into the binary is fetched here, not committed (so the repo
      # carries no unreviewable cert blob). Must run before go-toolchain builds/embeds.
      - run: ./scripts/fetch-cacerts.sh
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          generate: acf27fe87179
          autorelease: 'false'
      # On the default branch, cache this commit's route list keyed by its SHA.
      # Caches created on the default branch are restorable from every branch,
      # so feature-branch route-diff runs reuse this instead of rebuilding base.
      # The path MUST match route-diff's restore path: actions/cache derives the
      # cache version from the path, so a mismatched path is a guaranteed miss
      # even for an identical key.
      - if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: chmod +x build/buildhost_linux_amd64 && ./build/buildhost_linux_amd64 routes > base-routes.txt
      - if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: base-routes.txt
          key: route-list-${{ github.sha }}

  route-diff:
    needs: build
    # Only meaningful on a branch that has an open PR to comment on. The default
    # branch has no PR to diff against, and its own route list is already cached
    # by the build job above -- running here would just rebuild the base from
    # source and throw the result away. Skip it.
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # PR routes: from the go-build hand-off the build job already produced for
      # this ref. go-toolchain@v1 saves build/ via cache-upload (run-keyed cache
      # entry) instead of a GHA artifact, so it must be restored with the
      # matching cache-download action, not actions/download-artifact.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build/
      - run: chmod +x build/buildhost_linux_amd64 && echo "routes=$(./build/buildhost_linux_amd64 routes | base64 -w0)" >> "$GITHUB_OUTPUT"
        id: routes
      # Base routes: prefer the route list the default-branch build cached
      # (keyed by the base commit SHA). Build base from source only on a cold
      # cache -- without a real baseline the diff reports every route as added.
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/${{ github.repository }}/commits/${{ github.event.repository.default_branch }} --jq .sha)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: base-routes.txt
          key: route-list-${{ steps.base.outputs.sha }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      # Base may post-date the CA-bundle change and embed it; fetch before building it.
      # Inlined (not the script) so it works even on base commits that predate the script.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p base/internal/repackage/cacerts
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -o base/internal/repackage/cacerts/ca-certificates.crt https://curl.se/ca/cacert.pem
      # Build base with plain Go, NOT the go-toolchain action: go-toolchain@v1
      # unconditionally hands off build/ under the run-unique go-build cache key,
      # and a second same-run invocation (the build job already ran one) collides
      # on that key and fails. Mirrors homebrew-tap-e2e's setup-go + generate +
      # build recipe -- route-diff only needs a runnable base binary.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: base/go.mod
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: base
        run: |
          go generate ./internal/api
          go build -o build/buildhost_linux_amd64 ./cmd/buildhost
      - if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x base/build/buildhost_linux_amd64 && ./base/build/buildhost_linux_amd64 routes > base-routes.txt
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: base-routes.txt
          key: route-list-${{ steps.base.outputs.sha }}
      - id: baseroutes
        run: echo "routes=$(base64 -w0 base-routes.txt)" >> "$GITHUB_OUTPUT"
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          steps: ${{ toJSON(steps) }}
          script: |
              const prRoutes = Buffer.from(steps.routes.outputs.routes, "base64").toString().trimEnd();
              const baseRoutes = Buffer.from(steps.baseroutes.outputs.routes, "base64").toString().trimEnd();
              const gh = octokit("${{ github.token }}");
              const repo = { owner: context.repo.owner, repo: context.repo.repo };

              const prs = await gh.rest.pulls.list({ ...repo, head: `${repo.owner}:${context.ref.replace("refs/heads/", "")}`, state: "open" });
              if (prs.data.length === 0) {
                  core.info("No open PR for this branch");
                  process.exit(0);
              }
              const pr = prs.data[0].number;

              const marker = "<!-- route-diff -->";
              const comments = await gh.paginate(gh.rest.issues.listComments, { ...repo, issue_number: pr });
              const existing = comments.filter((c: any) => c.body?.includes("<!-- route-diff")).pop();

              if (baseRoutes === prRoutes) {
                  core.info("Routes match base branch");
                  if (existing) {
                      await gh.rest.issues.deleteComment({ ...repo, comment_id: existing.id });
                  }
                  process.exit(0);
              }

              fs.writeFileSync("/tmp/base-routes.txt", baseRoutes + "\n");
              fs.writeFileSync("/tmp/pr-routes.txt", prRoutes + "\n");
              const { stdout: diff } = child_process.spawnSync(
                  "diff", ["-u", "--label", "base", "--label", "pr", "/tmp/base-routes.txt", "/tmp/pr-routes.txt"],
                  { encoding: "utf8" },
              );

              const body = [
                  marker,
                  "### Route changes",
                  "",
                  "```diff",
                  diff.trimEnd(),
                  "```",
              ].join("\n");

              if (existing) {
                  await gh.rest.issues.updateComment({ ...repo, comment_id: existing.id, body });
              } else {
                  await gh.rest.issues.createComment({ ...repo, issue_number: pr, body });
              }

  container-healthcheck:
    # Only meaningful if the build succeeded and saved the go-build hand-off. Without
    # this, an always()-style condition makes it run on build failure and then fail on
    # the missing hand-off (a misleading second red X for one real failure).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build/
      - run: chmod +x build/buildhost_linux_amd64
      # Build the image (and pull its base layers) in a separate, untimed step
      # so the --wait-timeout below budgets only container startup, not the
      # image build/pull. up then reuses this image instead of rebuilding.
      - run: docker compose -f docker-compose.ci.yml build
      - run: docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 30
      - run: docker compose -f docker-compose.ci.yml logs
        if: failure()

  # Proves the DOCUMENTED Homebrew flows -- public and private -- work against a
  # real spawned buildhost with the real brew executable. The brew commands are
  # not written here: .github/scripts/brew-tap-e2e.ts extracts them verbatim
  # from README.md (and asserts the served llms.txt agrees), substituting only
  # the server host. Changing what CI runs therefore REQUIRES changing the
  # user-facing docs -- a "fix CI only" change goes red. (That drift already
  # happened once: Homebrew 6.0 broke `brew install` and the fix landed in CI
  # only, while README/llms.txt kept documenting a flow that failed for users.)
  homebrew-tap-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      BUILDHOST_LISTEN_ADDR: 127.0.0.1:18080
      BUILDHOST_BASE_URL: http://localhost:18080
      # CI-speed hygiene only -- these do not alter whether the documented flow
      # works (they skip brew's self-update and post-install cleanup). Every
      # flow-affecting knob (trust, the Linux sandbox) must come from the docs.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main
      # Homebrew 6's Linux build sandbox (bubblewrap) needs unprivileged user
      # namespaces, which Ubuntu 24.04 runners restrict via AppArmor. Lift the
      # restriction so CI runs the sandbox the way a real Linux user machine
      # does -- the docs document this exact sysctl for hardened hosts. The
      # HOMEBREW_NO_SANDBOX_LINUX opt-out the docs reserve for containers
      # without user namespaces is deliberately NOT set here.
      - if: runner.os == 'Linux'
        name: Host prep for Homebrew's build sandbox (bubblewrap + user namespaces)
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/fetch-cacerts.sh
      - run: go generate ./internal/api
      - run: go build -o buildhost ./cmd/buildhost
      - name: Start local buildhost
        shell: bash
        env:
          BUILDHOST_DATA_DIR: ${{ runner.temp }}/buildhost-data
          BUILDHOST_DB_PATH: ${{ runner.temp }}/buildhost-data/buildhost.db
          BUILDHOST_ADMIN_LISTEN_ADDR: ""
        run: |
          set -euo pipefail
          TOKEN="$(./buildhost bootstrap --name ci)"
          echo "::add-mask::$TOKEN"
          echo "BUILDHOST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ./buildhost serve > "$RUNNER_TEMP/buildhost.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/buildhost.pid"
          for _ in {1..60}; do
            if curl -fsS "$BUILDHOST_BASE_URL/healthz" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/buildhost.log"
          exit 1
      - name: Publish go-toolchain artifact (public)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux) os=linux ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          printf '%s\n' '#!/bin/sh' 'echo buildhost-homebrew-ok' > "$RUNNER_TEMP/go-toolchain"
          chmod +x "$RUNNER_TEMP/go-toolchain"
          ./buildhost project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name go-toolchain \
            --versioning semver
          printf '%s\n' \
            "server = \"$BUILDHOST_BASE_URL\"" \
            "token = \"$BUILDHOST_TOKEN\"" \
            'project = "go-toolchain"' \
            'version = "1.0.0"' \
            'git_branch = "master"' \
            "" \
            "[[artifact]]" \
            "path = \"$RUNNER_TEMP/go-toolchain\"" \
            "os = \"$os\"" \
            "arch = \"$arch\"" \
            'kind = "binary"' \
            > "$RUNNER_TEMP/buildhost-release.toml"
          ./buildhost publish --manifest "$RUNNER_TEMP/buildhost-release.toml"
      # Slash-namespaced AND private -- the exact shape of the live project this
      # e2e exists for. The folded formula name (myrepo-myapp) and the
      # basename-install rule are covered end to end.
      - name: Publish myrepo/myapp artifact (private, slash-namespaced)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux) os=linux ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          printf '%s\n' '#!/bin/sh' 'echo buildhost-homebrew-private-ok' > "$RUNNER_TEMP/myapp"
          chmod +x "$RUNNER_TEMP/myapp"
          ./buildhost project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name myrepo/myapp \
            --versioning semver \
            --private
          printf '%s\n' \
            "server = \"$BUILDHOST_BASE_URL\"" \
            "token = \"$BUILDHOST_TOKEN\"" \
            'project = "myrepo/myapp"' \
            'version = "1.0.0"' \
            'git_branch = "master"' \
            "" \
            "[[artifact]]" \
            "path = \"$RUNNER_TEMP/myapp\"" \
            "os = \"$os\"" \
            "arch = \"$arch\"" \
            'kind = "binary"' \
            > "$RUNNER_TEMP/buildhost-release-private.toml"
          ./buildhost publish --manifest "$RUNNER_TEMP/buildhost-release-private.toml"
      # Hostile-name fixtures for the formula-codegen guarantees the e2e
      # asserts: a digit-leading name must be EXCLUDED from brew entirely
      # (`class 7zip < Formula` is invalid Ruby and unloadable by design), and
      # a dotted name must fold into a valid, loadable class (DottedApp).
      - name: Publish hostile-name fixtures (public)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux) os=linux ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          printf '%s\n' '#!/bin/sh' 'echo hostile-name-fixture' > "$RUNNER_TEMP/hostile-bin"
          chmod +x "$RUNNER_TEMP/hostile-bin"
          for name in 7zip dotted.app; do
            ./buildhost project create \
              --server "$BUILDHOST_BASE_URL" \
              --token "$BUILDHOST_TOKEN" \
              --name "$name" \
              --versioning semver
            printf '%s\n' \
              "server = \"$BUILDHOST_BASE_URL\"" \
              "token = \"$BUILDHOST_TOKEN\"" \
              "project = \"$name\"" \
              'version = "1.0.0"' \
              'git_branch = "master"' \
              "" \
              "[[artifact]]" \
              "path = \"$RUNNER_TEMP/hostile-bin\"" \
              "os = \"$os\"" \
              "arch = \"$arch\"" \
              'kind = "binary"' \
              > "$RUNNER_TEMP/buildhost-release-hostile.toml"
            ./buildhost publish --manifest "$RUNNER_TEMP/buildhost-release-hostile.toml"
          done
      - name: Public install flow (brew commands extracted from the docs)
        uses: wow-look-at-my/actions@typescript#latest
        env:
          LEG: public
        with:
          file: .github/scripts/brew-tap-e2e.ts
      - name: Execute the publicly installed binary
        run: test "$(go-toolchain)" = "buildhost-homebrew-ok"
      # Docs: the authenticated tap replaces the public tap under the same name
      # ("remove it first with brew untap --force" -- plain untap refuses while
      # formulae installed from the tap exist).
      - name: Untap the public tap before the private flow (per docs)
        run: brew untap --force pazer/build
      - name: Private install flow (brew commands extracted from the docs)
        uses: wow-look-at-my/actions@typescript#latest
        env:
          LEG: private
        with:
          file: .github/scripts/brew-tap-e2e.ts
      - name: Execute the privately installed binary
        run: test "$(myapp)" = "buildhost-homebrew-private-ok"
      - name: Anonymous tap must not leak the private project
        uses: wow-look-at-my/actions@typescript#latest
        env:
          LEG: anon-leak
        with:
          file: .github/scripts/brew-tap-e2e.ts
      - name: Dump buildhost log
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.log" ]; then
            cat "$RUNNER_TEMP/buildhost.log"
          else
            echo "buildhost log was not created"
          fi
      - name: Stop local buildhost
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/buildhost.pid")" || true
          fi

  # Prove an image buildhost SYNTHESIZES from a plain binary is a valid, loadable
  # container image whose baked-in CA bundle works for real outbound HTTPS. Uses crane
  # (go-containerregistry): it pulls/decompresses buildhost's zstd layers, which the
  # default GitHub Docker (no containerd image store) may not.
  synthesized-image-e2e:
    needs: build
    runs-on: wow-linux
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build/
      - run: chmod +x build/buildhost_linux_amd64
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install crane (zstd-capable OCI client)
        run: go install github.com/google/go-containerregistry/cmd/crane@latest
      - name: Build netcheck entrypoint (static linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/netcheck" ./test/e2e/testdata/netcheck
      - name: Pull and run the synthesized OCI image
        run: PATH="$(go env GOPATH)/bin:$PATH" bash test/e2e/run.sh build/buildhost_linux_amd64 "$RUNNER_TEMP/netcheck"

  apt-install-e2e:
    needs: build
    runs-on: wow-linux
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build/
      - run: chmod +x build/buildhost_linux_amd64
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build apt test package payload (static linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/buildhost-apt-e2e" ./test/e2e/testdata/netcheck
      - name: Install from the generated APT repository
        run: bash test/e2e/apt-install.sh build/buildhost_linux_amd64 "$RUNNER_TEMP/buildhost-apt-e2e"

  # Proves the buildhost-upload-artifact composite action's BOTH upload paths
  # against a real spawned buildhost. The server's advertised direct-upload
  # limit is shrunk to 1 MiB so the chunked path runs with CI-sized files: a
  # 64 KiB file must go as one classic direct PUT (no session endpoints
  # touched), a ~3 MiB file must be assembled from 1 MiB chunks through an
  # upload session (create + 4 offset PATCHes + finalize), and the bytes the
  # server stored must match the local file exactly. The create-release and
  # publish-release composites run as part of the flow, so the whole
  # create -> upload -> publish action chain is covered end to end.
  #
  # The same spawned server also guards single-mode `buildhost publish` (no
  # --manifest) actually PUBLISHING the release it creates. The CLI package
  # deliberately has no unit tests (see internal/uploadclient's doc comment),
  # so like the --manifest flavor in homebrew-tap-e2e, the real binary is
  # exercised here: after a single-mode publish, the project's apex `latest`
  # must resolve to a published release -- it used to stay unpublished
  # forever (invisible to latest/branch/brew/apt/npm/web, eventually GC'd by
  # retention as an abandoned upload, with no CLI way to publish it later).
  upload-artifact-action-e2e:
    needs: build
    runs-on: wow-linux
    env:
      BUILDHOST_LISTEN_ADDR: 127.0.0.1:18080
      BUILDHOST_BASE_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build/
      - run: chmod +x build/buildhost_linux_amd64
      - name: Start local buildhost (1 MiB direct-upload limit)
        shell: bash
        env:
          BUILDHOST_DATA_DIR: ${{ runner.temp }}/buildhost-data
          BUILDHOST_DB_PATH: ${{ runner.temp }}/buildhost-data/buildhost.db
          BUILDHOST_ADMIN_LISTEN_ADDR: ""
          BUILDHOST_MAX_DIRECT_UPLOAD_SIZE: "1048576"
        run: |
          set -euo pipefail
          TOKEN="$(./build/buildhost_linux_amd64 bootstrap --name ci)"
          echo "::add-mask::$TOKEN"
          echo "BUILDHOST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ./build/buildhost_linux_amd64 serve > "$RUNNER_TEMP/buildhost.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/buildhost.pid"
          for _ in {1..60}; do
            if curl -fsS "$BUILDHOST_BASE_URL/healthz" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/buildhost.log"
          exit 1
      - name: Create project and test files
        shell: bash
        run: |
          set -euo pipefail
          ./build/buildhost_linux_amd64 project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name upload-e2e
          head -c 65536 /dev/urandom > "$RUNNER_TEMP/small.bin"
          head -c 3158217 /dev/urandom > "$RUNNER_TEMP/big.bin"
      - name: Create release
        id: release
        uses: ./.github/actions/buildhost-create-release
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          git_branch: master
      - name: Upload small file (direct PUT path)
        id: small
        uses: ./.github/actions/buildhost-upload-artifact
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          version: ${{ steps.release.outputs.version }}
          os: linux
          arch: amd64
          path: ${{ runner.temp }}/small.bin
          filename: small.bin
      - name: Small upload must not have used a session
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "path=/api/v1/uploads" "$RUNNER_TEMP/buildhost.log"; then
            echo "direct-path upload unexpectedly touched the session endpoints"
            grep "path=/api/v1/uploads" "$RUNNER_TEMP/buildhost.log"
            exit 1
          fi
      - name: Upload big file (chunked session path, 1 MiB chunks)
        id: big
        uses: ./.github/actions/buildhost-upload-artifact
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          version: ${{ steps.release.outputs.version }}
          os: linux
          arch: arm64
          path: ${{ runner.temp }}/big.bin
          filename: big.bin
          chunk_size: "1048576"
      - name: Big upload must have gone through a session in 4 chunks
        shell: bash
        run: |
          set -euo pipefail
          creates=$(grep -c "method=POST path=/api/v1/uploads " "$RUNNER_TEMP/buildhost.log" || true)
          chunks=$(grep -c "method=PATCH path=/api/v1/uploads/" "$RUNNER_TEMP/buildhost.log" || true)
          echo "session creates: $creates, chunk appends: $chunks"
          test "$creates" = "1"
          test "$chunks" = "4"
      - name: Publish release
        uses: ./.github/actions/buildhost-publish-release
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          version: ${{ steps.release.outputs.version }}
      - name: Verify uploaded artifacts
        shell: bash
        env:
          SMALL_SHA: ${{ steps.small.outputs.sha256 }}
          BIG_SHA: ${{ steps.big.outputs.sha256 }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # The sha256 outputs come from the SERVER hashing what it received
          # and stored -- equality with the local files proves byte integrity
          # end to end for both paths.
          test "$SMALL_SHA" = "$(sha256sum "$RUNNER_TEMP/small.bin" | awk '{print $1}')"
          test "$BIG_SHA" = "$(sha256sum "$RUNNER_TEMP/big.bin" | awk '{print $1}')"
          # And the chunk-assembled artifact downloads back byte-identical.
          curl -fsSL -o "$RUNNER_TEMP/big.dl" \
            "http://static.localhost:18080/file?project=upload-e2e&v=$VERSION&os=linux&arch=arm64"
          cmp "$RUNNER_TEMP/big.bin" "$RUNNER_TEMP/big.dl"
          # After publish, the release is visible as the apex latest.
          curl -fsS "$BUILDHOST_BASE_URL/api/v1/projects/upload-e2e/releases/latest" | grep -q '"published":true'
      - name: Single-mode CLI publish must publish the release
        shell: bash
        run: |
          set -euo pipefail
          head -c 4096 /dev/urandom > "$RUNNER_TEMP/cli.bin"
          ./build/buildhost_linux_amd64 project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name cli-single-e2e
          ./build/buildhost_linux_amd64 publish \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --project cli-single-e2e \
            --os linux --arch amd64 \
            --git-branch master \
            --artifact "$RUNNER_TEMP/cli.bin"
          curl -fsS "$BUILDHOST_BASE_URL/api/v1/projects/cli-single-e2e/releases/latest" | grep -q '"published":true'
      - name: Dump buildhost log
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.log" ]; then
            cat "$RUNNER_TEMP/buildhost.log"
          else
            echo "buildhost log was not created"
          fi
      - name: Stop local buildhost
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/buildhost.pid")" || true
          fi

  publish-ghcr:
    needs: container-healthcheck
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
