name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No fetch-cacerts step: the CA bundle is a generate directive
      - uses: wow-look-at-my/go-toolchain@master
        with:
          generate: 0af38e6ba5f6
      # The step above just ran every generate directive, which is what makes
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - env:
          BUILDHOST_BIN: ${{ github.workspace }}/build/buildhost
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/repo-hygiene.dats test/dats/compression-opts.dats test/dats/routes-golden.dats
      # On the default branch, cache this commit's route list keyed by its SHA.
      - if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/buildhost
          ./build/buildhost routes > base-routes.txt
          # Never cache an empty list: every later PR would restore it and
          if [ ! -s base-routes.txt ]; then
            echo "::error::route render produced no output; refusing to cache an empty base list"
            exit 1
          fi
      - if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: base-routes.txt
          key: route-list-${{ github.sha }}

  route-diff:
    needs: build
    # Only meaningful on a branch that has an open PR to comment on. The default
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # PR routes: from the go-build hand-off the build job already produced for
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/
      # render-routes: run the binary and REFUSE an empty or failed result.
      - name: Define the route renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-routes.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          bin="$1"; out="$2"; label="$3"
          if ! "$bin" routes > "$out"; then
            echo "::error::$label route render FAILED: '$bin routes' exited non-zero"
            exit 1
          fi
          if [ ! -s "$out" ]; then
            echo "::error::$label route render produced NO OUTPUT. Refusing to diff:"
            echo "::error::an empty $label makes every route look added or removed."
            exit 1
          fi
          echo "$label routes: $(wc -l < "$out") total, $(grep -c '^/api/v1' "$out" || true) under /api/v1"
          SH
          chmod +x "$RUNNER_TEMP/render-routes.sh"
      - id: routes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/buildhost
          "$RUNNER_TEMP/render-routes.sh" ./build/buildhost pr-routes.txt "PR"
          echo "routes=$(base64 -w0 pr-routes.txt)" >> "$GITHUB_OUTPUT"
      # Base routes: prefer the route list the default-branch build cached
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/${{ github.repository }}/commits/${{ github.event.repository.default_branch }} --jq .sha)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: base-routes.txt
          key: route-list-${{ steps.base.outputs.sha }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      # Base may post-date the CA-bundle change and embed it; fetch before building it.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p base/internal/repackage/cacerts
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -o base/internal/repackage/cacerts/ca-certificates.crt https://curl.se/ca/cacert.pem
      # Build base with plain Go, NOT the go-toolchain action: go-toolchain@v1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: base/go.mod
      # The admin dashboard's JS is a generate directive too (internal/admin),
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: base
        run: |
          go generate ./internal/api
          if [ -x scripts/build-admin-frontend.sh ]; then ./scripts/build-admin-frontend.sh; fi
          go build -o build/buildhost_linux_amd64 ./cmd/buildhost
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x base/build/buildhost_linux_amd64
          "$RUNNER_TEMP/render-routes.sh" ./base/build/buildhost_linux_amd64 base-routes.txt "base"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: base-routes.txt
          key: route-list-${{ steps.base.outputs.sha }}
      - id: baseroutes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s base-routes.txt ]; then
            echo "::error::base route list is empty or missing (cache hit: ${{ steps.cache.outputs.cache-hit }})."
            echo "::error::Refusing to diff -- an empty base reports every route as added."
            exit 1
          fi
          echo "base routes: $(wc -l < base-routes.txt) total, $(grep -c '^/api/v1' base-routes.txt || true) under /api/v1"
          echo "routes=$(base64 -w0 base-routes.txt)" >> "$GITHUB_OUTPUT"
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          steps: ${{ toJSON(steps) }}
          script: |
              const prRoutes = Buffer.from(steps.routes.outputs.routes, "base64").toString().trimEnd();
              const baseRoutes = Buffer.from(steps.baseroutes.outputs.routes, "base64").toString().trimEnd();
              const gh = octokit("${{ github.token }}");
              const repo = { owner: context.repo.owner, repo: context.repo.repo };

              const prs = await gh.rest.pulls.list({ ...repo, head: `${repo.owner}:${context.ref.replace("refs/heads/", "")}`, state: "open" });
              if (prs.data.length === 0) {
                  core.info("No open PR for this branch");
                  process.exit(0);
              }
              const pr = prs.data[0].number;

              const marker = "<!-- route-diff -->";
              const comments = await gh.paginate(gh.rest.issues.listComments, { ...repo, issue_number: pr });
              const existing = comments.filter((c: any) => c.body?.includes("<!-- route-diff")).pop();

              if (baseRoutes === prRoutes) {
                  core.info("Routes match base branch");
                  if (existing) {
                      await gh.rest.issues.deleteComment({ ...repo, comment_id: existing.id });
                  }
                  process.exit(0);
              }

              fs.writeFileSync("/tmp/base-routes.txt", baseRoutes + "\n");
              fs.writeFileSync("/tmp/pr-routes.txt", prRoutes + "\n");
              const { stdout: diff } = child_process.spawnSync(
                  "diff", ["-u", "--label", "base", "--label", "pr", "/tmp/base-routes.txt", "/tmp/pr-routes.txt"],
                  { encoding: "utf8" },
              );

              const body = [
                  marker,
                  "### Route changes",
                  "",
                  "```diff",
                  diff.trimEnd(),
                  "```",
              ].join("\n");

              if (existing) {
                  await gh.rest.issues.updateComment({ ...repo, comment_id: existing.id, body });
              } else {
                  await gh.rest.issues.createComment({ ...repo, issue_number: pr, body });
              }

  # The publish composites all import .github/actions/lib/storage-record, and
  storage-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/action-libs.dats

  container-healthcheck:
    # Only meaningful if the build succeeded and saved the go-build hand-off. Without
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/
      - run: chmod +x build/buildhost
      # Build the image (and pull its base layers) in a separate, untimed step
      - run: docker compose -f docker-compose.ci.yml build
      - run: docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 30
      # Stripping is documented to happen at download time, and it silently did
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the strip fixture
        run: go build -o "$RUNNER_TEMP/strip-fixture" ./test/e2e/testdata/netcheck
      - env:
          STRIP_FIXTURE: ${{ runner.temp }}/strip-fixture
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/image-strips.dats
      - run: docker compose -f docker-compose.ci.yml logs
        if: failure()

  # Proves the DOCUMENTED Homebrew flows -- public and private -- work against a
  homebrew-tap-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      BUILDHOST_LISTEN_ADDR: 127.0.0.1:18080
      BUILDHOST_BASE_URL: http://localhost:18080
      # CI-speed hygiene only -- these do not alter whether the documented flow
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main
      # Homebrew 6's Linux build sandbox (bubblewrap) needs unprivileged user
      - if: runner.os == 'Linux'
        name: Host prep for Homebrew's build sandbox (bubblewrap + user namespaces)
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/fetch-cacerts.sh
      - run: go generate ./internal/api
      # The dashboard JS is generated, not committed, and embedded by name.
      - run: ./scripts/build-admin-frontend.sh
      - run: go build -o buildhost ./cmd/buildhost
      - name: Start local buildhost
        shell: bash
        env:
          BUILDHOST_DATA_DIR: ${{ runner.temp }}/buildhost-data
          BUILDHOST_DB_PATH: ${{ runner.temp }}/buildhost-data/buildhost.db
          BUILDHOST_ADMIN_LISTEN_ADDR: ""
        run: |
          set -euo pipefail
          TOKEN="$(./buildhost bootstrap --name ci)"
          echo "::add-mask::$TOKEN"
          echo "BUILDHOST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ./buildhost serve > "$RUNNER_TEMP/buildhost.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/buildhost.pid"
          for _ in {1..60}; do
            if curl -fsS "$BUILDHOST_BASE_URL/healthz" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/buildhost.log"
          exit 1
      - name: Publish go-toolchain artifact (public)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux) os=linux ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          # Publish the REAL go-toolchain binary from the live registry, not a
          curl -fsSL --compressed \
            "https://dl.pazer.build/go-toolchain?branch=v1&os=$os&arch=$arch" \
            -o "$RUNNER_TEMP/go-toolchain"
          chmod +x "$RUNNER_TEMP/go-toolchain"
          file "$RUNNER_TEMP/go-toolchain"
          ./buildhost project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name go-toolchain \
            --versioning semver
          printf '%s\n' \
            "server = \"$BUILDHOST_BASE_URL\"" \
            "token = \"$BUILDHOST_TOKEN\"" \
            'project = "go-toolchain"' \
            'version = "1.0.0"' \
            'git_branch = "master"' \
            "" \
            "[[artifact]]" \
            "path = \"$RUNNER_TEMP/go-toolchain\"" \
            "os = \"$os\"" \
            "arch = \"$arch\"" \
            'kind = "binary"' \
            > "$RUNNER_TEMP/buildhost-release.toml"
          ./buildhost publish --manifest "$RUNNER_TEMP/buildhost-release.toml"
      # go-toolchain ships an APE only on Linux; its darwin artifacts are plain
      - name: Publish ape-fixture artifact (public, APE-shaped)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux) os=linux ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          printf '%s\n' \
            "MZqFpD='APE-shaped fixture: not a shebang script, not an ELF or Mach-O'" \
            ': >> "$0" || { echo "self-write failed: an APE binary rewrites itself on first run" >&2; exit 1; }' \
            'echo buildhost-homebrew-ape-ok' > "$RUNNER_TEMP/ape-fixture"
          chmod +x "$RUNNER_TEMP/ape-fixture"
          ./buildhost project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name ape-fixture \
            --versioning semver
          printf '%s\n' \
            "server = \"$BUILDHOST_BASE_URL\"" \
            "token = \"$BUILDHOST_TOKEN\"" \
            'project = "ape-fixture"' \
            'version = "1.0.0"' \
            'git_branch = "master"' \
            "" \
            "[[artifact]]" \
            "path = \"$RUNNER_TEMP/ape-fixture\"" \
            "os = \"$os\"" \
            "arch = \"$arch\"" \
            'kind = "binary"' \
            > "$RUNNER_TEMP/buildhost-release-ape.toml"
          ./buildhost publish --manifest "$RUNNER_TEMP/buildhost-release-ape.toml"
      # Slash-namespaced AND private -- the exact shape of the live project this
      - name: Publish myrepo/myapp artifact (private, slash-namespaced)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux) os=linux ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          printf '%s\n' '#!/bin/sh' 'echo buildhost-homebrew-private-ok' > "$RUNNER_TEMP/myapp"
          chmod +x "$RUNNER_TEMP/myapp"
          ./buildhost project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name myrepo/myapp \
            --versioning semver \
            --private
          printf '%s\n' \
            "server = \"$BUILDHOST_BASE_URL\"" \
            "token = \"$BUILDHOST_TOKEN\"" \
            'project = "myrepo/myapp"' \
            'version = "1.0.0"' \
            'git_branch = "master"' \
            "" \
            "[[artifact]]" \
            "path = \"$RUNNER_TEMP/myapp\"" \
            "os = \"$os\"" \
            "arch = \"$arch\"" \
            'kind = "binary"' \
            > "$RUNNER_TEMP/buildhost-release-private.toml"
          ./buildhost publish --manifest "$RUNNER_TEMP/buildhost-release-private.toml"
      # Hostile-name fixtures for the formula-codegen guarantees the e2e
      - name: Publish hostile-name fixtures (public)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux) os=linux ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          printf '%s\n' '#!/bin/sh' 'echo hostile-name-fixture' > "$RUNNER_TEMP/hostile-bin"
          chmod +x "$RUNNER_TEMP/hostile-bin"
          for name in 7zip dotted.app; do
            ./buildhost project create \
              --server "$BUILDHOST_BASE_URL" \
              --token "$BUILDHOST_TOKEN" \
              --name "$name" \
              --versioning semver
            printf '%s\n' \
              "server = \"$BUILDHOST_BASE_URL\"" \
              "token = \"$BUILDHOST_TOKEN\"" \
              "project = \"$name\"" \
              'version = "1.0.0"' \
              'git_branch = "master"' \
              "" \
              "[[artifact]]" \
              "path = \"$RUNNER_TEMP/hostile-bin\"" \
              "os = \"$os\"" \
              "arch = \"$arch\"" \
              'kind = "binary"' \
              > "$RUNNER_TEMP/buildhost-release-hostile.toml"
            ./buildhost publish --manifest "$RUNNER_TEMP/buildhost-release-hostile.toml"
          done
      # Each suite runs the documented flow in its own setup and then asserts
      - env:
          BREW_HOST: brew.localhost:18080
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/homebrew-public.dats
      # Docs: the authenticated tap replaces the public tap under the same name
      - name: Untap the public tap before the private flow (per docs)
        run: brew untap --force pazer/build
      - env:
          BREW_HOST: brew.localhost:18080
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/homebrew-private.dats
      - env:
          BREW_HOST: brew.localhost:18080
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/homebrew-anon-leak.dats
      - name: Dump buildhost log
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.log" ]; then
            cat "$RUNNER_TEMP/buildhost.log"
          else
            echo "buildhost log was not created"
          fi
      - name: Stop local buildhost
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/buildhost.pid")" || true
          fi

  # Prove an image buildhost SYNTHESIZES from a plain binary is a valid, loadable
  synthesized-image-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/
      - run: chmod +x build/buildhost
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install crane (zstd-capable OCI client)
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build netcheck entrypoint (static linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/netcheck" ./test/e2e/testdata/netcheck
      # The OCI endpoint is host-routed: the first Host label must be "oci".
      - name: Map the OCI host to the local server
        run: echo "127.0.0.1 oci.buildhost.test" | sudo tee -a /etc/hosts
      # buildhost's layers are zstd, which Docker reads only through the
      - name: Turn on the containerd image store
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          existing="$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')"
          printf '%s' "$existing" | jq \
            --arg reg "oci.buildhost.test:8088" \
            '.features."containerd-snapshotter" = true
             | .["insecure-registries"] = ((.["insecure-registries"] // []) + [$reg] | unique)' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
      - env:
          BUILDHOST_BIN: ${{ github.workspace }}/build/buildhost
          NETCHECK_BIN: ${{ runner.temp }}/netcheck
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/synthesized-image.dats

  # Proves a hosted site stays loadable CROSS-ORIGIN, through its redirects, in
  sites-cors-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/
      - run: chmod +x build/buildhost
      # playwright-core drives the runner's preinstalled Chrome; it is a
      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.62.1
      - name: A hosted site must load cross-origin in a real browser
        env:
          BUILDHOST_BIN: ${{ github.workspace }}/build/buildhost
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/sites-cors.dats
      # The preview publishes this same static dir with no backend behind it, so
      - name: Build the admin frontend
        run: ./scripts/build-admin-frontend.sh
      - name: Every link on the preview dashboard must reach a page
        timeout-minutes: 10
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/admin-demo-links.dats

  apt-install-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/
      - run: chmod +x build/buildhost
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build apt test package payload (static linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/buildhost-apt-e2e" ./test/e2e/testdata/netcheck
      # The apt repository and the package download redirect are host-routed.
      - name: Map the apt and static hosts to the local server
        run: printf '127.0.0.1 apt.localhost\n127.0.0.1 static.localhost\n' | sudo tee -a /etc/hosts
      - env:
          BUILDHOST_BIN: ${{ github.workspace }}/build/buildhost
          ARTIFACT_BIN: ${{ runner.temp }}/buildhost-apt-e2e
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/apt-install.dats

  # Proves the buildhost-upload-artifact composite action's BOTH upload paths
  multi-platform-ape-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/
      - run: chmod +x build/buildhost
      # --no-sandbox: the suite drives the server with curl and jq, which the
      - run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/multi-platform-ape.dats

  upload-artifact-action-e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILDHOST_LISTEN_ADDR: 127.0.0.1:18080
      BUILDHOST_BASE_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/buildhost-download
        with:
          project: dats
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/
      - run: chmod +x build/buildhost
      - name: Start local buildhost (1 MiB direct-upload limit)
        shell: bash
        env:
          BUILDHOST_DATA_DIR: ${{ runner.temp }}/buildhost-data
          BUILDHOST_DB_PATH: ${{ runner.temp }}/buildhost-data/buildhost.db
          BUILDHOST_ADMIN_LISTEN_ADDR: ""
          BUILDHOST_MAX_DIRECT_UPLOAD_SIZE: "1048576"
        run: |
          set -euo pipefail
          TOKEN="$(./build/buildhost bootstrap --name ci)"
          echo "::add-mask::$TOKEN"
          echo "BUILDHOST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ./build/buildhost serve > "$RUNNER_TEMP/buildhost.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/buildhost.pid"
          for _ in {1..60}; do
            if curl -fsS "$BUILDHOST_BASE_URL/healthz" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/buildhost.log"
          exit 1
      - name: Create project and test files
        shell: bash
        run: |
          set -euo pipefail
          ./build/buildhost project create \
            --server "$BUILDHOST_BASE_URL" \
            --token "$BUILDHOST_TOKEN" \
            --name upload-e2e
          head -c 65536 /dev/urandom > "$RUNNER_TEMP/small.bin"
          head -c 3158217 /dev/urandom > "$RUNNER_TEMP/big.bin"
      - name: Create release
        id: release
        uses: ./.github/actions/buildhost-create-release
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          git_branch: master
      - name: Upload small file (direct PUT path)
        id: small
        uses: ./.github/actions/buildhost-upload-artifact
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          version: ${{ steps.release.outputs.version }}
          os: linux
          arch: amd64
          path: ${{ runner.temp }}/small.bin
          filename: small.bin
      - env:
          LOG: ${{ runner.temp }}/buildhost.log
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/upload-direct.dats
      - name: Upload big file (chunked session path, 1 MiB chunks)
        id: big
        uses: ./.github/actions/buildhost-upload-artifact
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          version: ${{ steps.release.outputs.version }}
          os: linux
          arch: arm64
          path: ${{ runner.temp }}/big.bin
          filename: big.bin
          chunk_size: "1048576"
      - name: Publish release
        uses: ./.github/actions/buildhost-publish-release
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          version: ${{ steps.release.outputs.version }}
      # What the two upload paths did to the server -- one session for the
      - env:
          LOG: ${{ runner.temp }}/buildhost.log
          SMALL_FILE: ${{ runner.temp }}/small.bin
          BIG_FILE: ${{ runner.temp }}/big.bin
          SMALL_SHA: ${{ steps.small.outputs.sha256 }}
          BIG_SHA: ${{ steps.big.outputs.sha256 }}
          VERSION: ${{ steps.release.outputs.version }}
          BASE: http://localhost:18080
          STATIC: http://static.localhost:18080
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/upload-artifact.dats
      - name: Create site fixtures (one tiny, one over the direct limit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/small-site" "$RUNNER_TEMP/big-site"
          printf '<h1>direct site</h1>' > "$RUNNER_TEMP/small-site/index.html"
          printf '<h1>chunked site</h1>' > "$RUNNER_TEMP/big-site/index.html"
          # Incompressible payload so the tar.gz stays ~3 MB, well over the
          head -c 3000000 /dev/urandom > "$RUNNER_TEMP/big-site/blob.bin"
      - name: Publish small site (direct PUT path)
        uses: ./.github/actions/buildhost-publish-site
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          branch: direct
          source_dir: ${{ runner.temp }}/small-site
          chunk_size: "1048576"
      - env:
          LOG: ${{ runner.temp }}/buildhost.log
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/site-direct.dats
      - name: Publish big site (chunked session path, 1 MiB chunks)
        id: publish-big-site
        uses: ./.github/actions/buildhost-publish-site
        with:
          server: http://localhost:18080
          token: ${{ env.BUILDHOST_TOKEN }}
          project: upload-e2e
          branch: chunked
          source_dir: ${{ runner.temp }}/big-site
          chunk_size: "1048576"
      # What the site publishes and the CLI did to the same server. The
      - env:
          LOG: ${{ runner.temp }}/buildhost.log
          SITES: http://sites.localhost:18080
          BASE: http://localhost:18080
          TOKEN: ${{ env.BUILDHOST_TOKEN }}
          BIN: ${{ github.workspace }}/build/buildhost
          BIG_SITE_BLOB: ${{ runner.temp }}/big-site/blob.bin
          SITE_URL: ${{ steps.publish-big-site.outputs.site_url }}
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/site-publish.dats
      - name: Dump buildhost log
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.log" ]; then
            cat "$RUNNER_TEMP/buildhost.log"
          else
            echo "buildhost log was not created"
          fi
      - name: Stop local buildhost
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/buildhost.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/buildhost.pid")" || true
          fi

  publish-ghcr:
    needs: container-healthcheck
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
