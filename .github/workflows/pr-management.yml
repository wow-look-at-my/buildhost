name: PR Management

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

concurrency:
    group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
    id-token: write
    contents: write
    pull-requests: write

jobs:
    manage:
        uses: wow-look-at-my/actions/.github/workflows/pr-management.yml@lkgb
