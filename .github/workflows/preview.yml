name: PR preview

# Deploy a PR preview of the admin dashboard (internal/admin/static) to buildhost

on:
  push:
    branches: ['**']

permissions:
  contents: read
  actions: read
  # buildhost-publish-site hands the preview URL to this branch's pull request
  pull-requests: write
  id-token: write
  checks: read
  # buildhost-publish-site records what it uploaded on the org's linked
  artifact-metadata: write
  deployments: write

jobs:
  # internal/admin/static holds only index.html and style.css in git -- app.js and
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same script the //go:generate directive runs, so the preview and the
      - run: ./scripts/build-admin-frontend.sh
      # One job, so the built site is right here: no artifact hand-off at all.
      - uses: ./.github/actions/buildhost-publish-site
        with:
          branch: ${{ github.ref_name }}
          source_dir: internal/admin/static
