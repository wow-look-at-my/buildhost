name: PR preview

# Deploy a PR preview of the admin dashboard (internal/admin/static) to buildhost
# itself via the org's buildhost-flavour PR-preview reusable workflow. PRs deploy
# to a pr-<number> branch; pushes to master deploy to branch/master. The project
# defaults to the (lowercase) repo name -> "buildhost".
#
# NOTE: the reusable workflow lives in wow-look-at-my/actions and is referenced at
# @master, so this requires that workflow to be on actions' master branch first.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write
  # checks read: the org no-all-builds-job guard (the first step inside
  # buildhost-publish-site, which the reusable buildhost-preview workflow
  # calls) scans the run's jobs and the head commit's check runs since
  # no-all-builds-job#3 (2026-07-20), and FAILS CLOSED when it cannot scan
  # ("Resource not accessible by integration"). A called workflow's jobs
  # never get a scope its caller does not grant, so the grant must be here.
  checks: read

jobs:
  preview:
    uses: wow-look-at-my/actions/.github/workflows/buildhost-preview.yml@master
    with:
      source-dir: internal/admin/static
    secrets: inherit
