name: Publish to Buildhost
version: 1
description: Publish go-toolchain matrix binaries to a buildhost registry using GHA OIDC, from a GHA run artifact or a local directory.

inputs:
  server:
    description: 'Buildhost server URL'
    required: false
    default: 'https://pazer.build'
  project:
    description: 'Project name (defaults to the repository name)'
    required: false
  artifact_name:
    description: 'GHA run artifact name (defaults to go-build from go-toolchain); ignored when path is set'
    required: false
    default: 'go-build'
  path:
    description: 'Local directory containing the release binaries to publish, resolved relative to the workspace. When set, the run''s artifacts are NOT downloaded and the artifact_name input is ignored; files are read from this directory instead (no actions: read permission needed; the publish script never reads GITHUB_TOKEN in this mode, though the GitHub Deployment steps use github.token and require deployments: write).'
    required: false
  version:
    description: 'Release version (omit for auto-versioned projects)'
    required: false
  git_branch:
    description: 'Git branch (defaults to GITHUB_REF_NAME)'
    required: false
  git_commit:
    description: 'Git commit SHA (defaults to GITHUB_SHA)'
    required: false
  create_service:
    description: >-
      Declare that the published binary runs as a background service ('true'
      or 'false'); each download format materializes it its own way (brew
      formulas gain a `service do` block, on-the-fly debs ship a systemd
      user unit). Empty (the default) sends nothing, leaving the stored
      project setting untouched -- byte-identical requests to before this
      input existed. Applies to every project this publish creates a release
      for (the repo project and any <repo>/<binary> sub-projects).
    required: false
    default: ''
  default_branch:
    description: >-
      The repo's default branch (e.g. 'main'). When set, the apex "latest"
      tracks this branch for each published project -- a manual override for
      publishers whose default branch the server cannot learn itself (private
      repos it cannot reach, non-GitHub publishers). Empty (the default)
      sends nothing, leaving the stored project setting untouched --
      byte-identical requests to before this input existed. Applies to every
      project this publish creates a release for.
    required: false
    default: ''
  deployment_environment:
    description: >-
      GitHub Deployment environment name (defaults to `buildhost/<project>`).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    # Registering the publish as a GitHub Deployment is part of publishing, not
    # an add-on: it has no opt-out input and a failure fails the step. Warning
    # and continuing was an opt-out by neglect -- seven of the eight callers had
    # been skipping deployments entirely, each one green, because nobody reads a
    # warning in a passing run. The calling job needs `deployments: write`
    # (ADDITIVE -- a job-level permissions block replaces the workflow-level one).
    - name: Create GitHub Deployment
      id: deployment
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            core.setOutput('deployment_id', '');
            // A deployment asserts "this publish is live at <environment_url>".
            // Against a loopback or plain-http server -- buildhost's own e2e
            // spawns one on http://localhost:18080 -- that assertion is false:
            // nothing outside the runner can reach it. So there is nothing true
            // to register, exactly as there is nothing recordable for a loopback
            // registry. A property of the target, not an opt-out: every publish
            // to a real server registers, and a failure there is fatal.
            const deployServer: string = "${{ inputs.server }}";
            const deployHost: string = new URL(deployServer).hostname;
            if (deployHost === "localhost" || deployHost === "127.0.0.1" || deployHost === "::1" || !deployServer.startsWith("https://")) {
              core.info(`Skipping the GitHub Deployment: ${deployServer} is not a reachable https server, so its deployment URL would point nowhere`);
              return;
            }
            try {
              const inputProject: string = "${{ inputs.project }}";
              const project: string = inputProject || github.repository.split('/').pop()!;
              const envInput: string = "${{ inputs.deployment_environment }}";
              const environment: string = envInput || `buildhost/${project}`;
              const inputCommit: string = "${{ inputs.git_commit }}";
              const ref: string = inputCommit || context.sha;
              const inputBranch: string = "${{ inputs.git_branch }}";
              const branch: string = inputBranch || github.ref_name || '';
              const defaultBranch: string = context.payload.repository?.default_branch ?? '';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              // required_contexts MUST be [] (the API default is "every commit
              // status", and the org's all-builds status is still pending on
              // this sha mid-run -> 409 Conflict); auto_merge MUST be false
              // (the API default would try to merge the default branch into
              // ref). A 2xx response without an id (e.g. the 202 auto-merge
              // shape) is treated as "no deployment".
              const dep = await octokit.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                environment,
                auto_merge: false,
                required_contexts: [],
                transient_environment: false,
                production_environment: defaultBranch !== '' && branch === defaultBranch,
                description: `buildhost publish of ${project}`.slice(0, 140),
              });
              const id = (dep.data as any)?.id;
              if (typeof id !== 'number') {
                core.setFailed(`GitHub Deployment not created (HTTP ${dep.status}): the API returned no deployment id`);
                return;
              }
              core.setOutput('deployment_id', String(id));
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: id,
                state: 'in_progress',
                log_url: runUrl,
                description: 'Publishing to buildhost',
              });
              core.info(`Created GitHub Deployment ${id} in environment '${environment}'`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not create the GitHub Deployment (${msg}). Add 'deployments: write' to this job's permissions block -- job-level permissions REPLACE workflow-level ones, so add it alongside the ones the job already declares. Registering the publish is part of publishing and cannot be turned off.`);
            }
          })();

    - id: publish
      uses: wow-look-at-my/actions@typescript#latest
      env:
        # Only artifact mode (path unset) talks to the GitHub API from THIS
        # step; path mode gets no token at all. (The optional deployment steps
        # authenticate separately, via the typescript action's own
        # github-token input default -- never via this env var.)
        GITHUB_TOKEN: ${{ inputs.path == '' && github.token || '' }}
      with:
        script: |
          await (async () => {
            const inputProject: string = "${{ inputs.project }}";
            const inputVersion: string = "${{ inputs.version }}";
            const inputBranch: string = "${{ inputs.git_branch }}";
            const inputCommit: string = "${{ inputs.git_commit }}";
            const artifactName: string = "${{ inputs.artifact_name }}";
            const inputPath: string = "${{ inputs.path }}";
            const inputBrewService: string = "${{ inputs.create_service }}";
            if (inputBrewService !== '' && inputBrewService !== 'true' && inputBrewService !== 'false') {
              core.setFailed(`create_service must be 'true', 'false', or empty; got '${inputBrewService}'`);
              return;
            }
            const inputDefaultBranch: string = "${{ inputs.default_branch }}";

            const server = "${{ inputs.server }}";
            const project = inputProject.length > 0 ? inputProject : github.repository.split("/").pop()!;
            const version = inputVersion;
            const gitBranch = inputBranch.length > 0 ? inputBranch : github.ref_name;
            const gitCommit = inputCommit.length > 0 ? inputCommit : github.sha;

            // Locate the release binaries. `path` mode reads a local directory
            // as-is -- no GHA artifact download, no GitHub API call, and
            // GITHUB_TOKEN is never read (so the caller needs no
            // `actions: read` permission). Artifact mode (the default)
            // downloads the run's `artifact_name` artifact and unzips it.
            let sourceDir: string;
            if (inputPath.length > 0) {
              sourceDir = path.resolve(env.GITHUB_WORKSPACE || process.cwd(), inputPath);
              if (!fs.existsSync(sourceDir) || !fs.statSync(sourceDir).isDirectory()) {
                core.setFailed(`Binaries directory '${sourceDir}' (from the 'path' input) does not exist or is not a directory`);
                return;
              }
              if (fs.readdirSync(sourceDir).length === 0) {
                core.setFailed(`Binaries directory '${sourceDir}' (from the 'path' input) is empty`);
                return;
              }
              core.info(`Publishing from local directory ${sourceDir} (GHA artifact download skipped)`);
            } else {
              sourceDir = path.join(os.tmpdir(), "buildhost-publish");
              fs.mkdirSync(sourceDir, { recursive: true });

              // Download artifact via octokit
              const oct = octokit(process.env.GITHUB_TOKEN!);
              const [owner, repo] = github.repository.split("/");
              const { data: { artifacts } } = await oct.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: github.run_id,
              });
              const artifact = artifacts.find((a: any) => a.name === artifactName);
              if (!artifact) { core.setFailed(`Artifact '${artifactName}' not found in run`); return; }

              const { data: zip } = await oct.rest.actions.downloadArtifact({
                owner, repo, artifact_id: artifact.id, archive_format: "zip",
              });
              const zipPath = path.join(sourceDir, "artifact.zip");
              fs.writeFileSync(zipPath, Buffer.from(zip as ArrayBuffer));
              await exec.exec("unzip", ["-o", zipPath, "-d", sourceDir]);
            }

            // Mint OIDC token for buildhost
            const idTokenUrl = env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const idTokenBearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!idTokenUrl || !idTokenBearer) {
              core.setFailed("OIDC not available. Add 'permissions: { id-token: write }'.");
              return;
            }
            const idResp = await fetch(`${idTokenUrl}&audience=${server}`, {
              headers: { Authorization: `Bearer ${idTokenBearer}` },
            });
            const token: string = ((await idResp.json()) as { value: string }).value;
            if (!token) { core.setFailed("Failed to obtain OIDC token"); return; }

            // Hash-reference capability (public server-info): when advertised,
            // byte-identical files upload once and the remaining slots are
            // registered with an empty-body PUT + upload_sha256. NEVER probe
            // instead of checking -- a server without the capability silently
            // ignores the parameter and would store the empty body as the
            // artifact, permanently poisoning the slot.
            let canHashRef = false;
            try {
              const infoResp = await fetch(`${server}/api/v1/server-info`);
              if (infoResp.ok) {
                canHashRef = ((await infoResp.json()) as { upload_by_sha256?: boolean }).upload_by_sha256 === true;
              }
            } catch { /* capability stays off; full uploads always work */ }

            // Artifact-metadata storage records, accumulated as artifacts are
            // accepted and posted below before this step returns. The recorded
            // digest is always the sha256 of the bytes as UPLOADED -- buildhost
            // strips and repackages on demand, so the default download of an
            // ELF is not byte-identical to the upload. `debug=1` is the one
            // download that returns the uploaded bytes verbatim, so that is
            // what artifact_url points at: the URL and the digest must agree.
            type StorageRecord = {
              name: string; version: string; digest: string; registry_url: string;
              repository: string; path: string; artifact_url: string;
            };
            const storageRecords: StorageRecord[] = [];

            // Recording what buildhost now stores is PART of publishing, not a
            // bolt-on: it happens inside this step, has no opt-out input, and a
            // failure fails the publish. A warn-and-continue path would be an
            // opt-out by neglect -- the publish would stay green while the
            // org's linked artifacts page silently fell behind reality.
            // What a failing storage-record POST actually tells you. A 404 is NOT
            // proof of a missing grant: the endpoint is org-scoped, so it also 404s
            // when {org} names no organization this token can see. The owner-type
            // probe's own answer is what separates the two.
            const recordFailureDetail = (status: number | undefined, msg: string, owner: string, ownerType: string): string => {
              if (status === 403) {
                return `(HTTP 403: ${msg}). The token was refused for artifact metadata: this job must grant 'artifact-metadata: write' -- job-level permissions REPLACE workflow-level ones, so a job-level block must list it alongside the ones it already declares. Recording what buildhost stores is part of publishing and cannot be turned off.`;
              }
              if (status === 404) {
                const probe = ownerType === '' ? 'failed, so the owner type is unknown' : `reported '${ownerType}'`;
                return `(HTTP 404: ${msg}). POST /orgs/${owner}/artifacts/metadata/storage-record found no organization named ${owner} that this token can see, and GET /users/${owner} ${probe} -- a user-account owner is skipped rather than recorded. If ${owner} is an organization, the token is missing 'artifact-metadata: write' (job-level permissions REPLACE workflow-level ones). Recording what buildhost stores is part of publishing and cannot be turned off.`;
              }
              return `(${msg}).`;
            };
            const postStorageRecords = async (): Promise<boolean> => {
              if (storageRecords.length === 0) return true;
              // A loopback server is not a registry anything can fetch from
              // (buildhost's own e2e spawns one), so a record pointing at it
              // would be an unreachable row on the org's page. This is a
              // property of the target, not a caller-facing switch.
              const registry = storageRecords[0].registry_url;
              const host = new URL(registry).hostname;
              if (host === "localhost" || host === "127.0.0.1" || host === "::1" || !registry.startsWith("https://")) {
                core.info(`Skipping ${storageRecords.length} storage record(s): ${registry} is not a reachable https registry (the API accepts https URLs only)`);
                return true;
              }
              const org = context.repo.owner;
              const githubRepository = context.repo.repo;
              for (const rec of storageRecords) {
                const { artifact_url: artifactURL, ...rest } = rec;
                if (artifactURL.length > 152) {
                  core.setFailed(`Cannot record ${rec.name} ${rec.path}: its artifact_url is ${artifactURL.length} chars, over the API's 152-char limit. Recording it without the URL would silently drop the only link back to the bytes the digest covers; shorten the project name or change the download URL scheme.`);
                  return false;
                }
                try {
                  await octokit.request("POST /orgs/{org}/artifacts/metadata/storage-record", {
                    org, ...rest, artifact_url: artifactURL,
                    github_repository: githubRepository, status: "active", return_records: false,
                  });
                  core.info(`Recorded ${rec.name} ${rec.path} ${rec.digest}`);
                } catch (e) {
                  const status = (e as { status?: number }).status;
                  const msg = e instanceof Error ? e.message : String(e);
                  // A personal account has no linked artifacts page, so the
                  // org-scoped endpoint 404s no matter what the token grants
                  // -- a property of the target, like the loopback skip above.
                  // Checked only on a 404 (orgs pay no extra call) and fails
                  // closed: an unreadable owner type leaves the failure standing.
                  const ownerType = status === 404
                    ? await octokit.rest.users.getByUsername({ username: org }).then((r: { data: { type?: string } }) => r.data.type ?? "").catch(() => "")
                    : "";
                  if (ownerType === "User") {
                    core.info(`Skipping ${storageRecords.length} storage record(s): ${org} is a user account, which has no linked artifacts page`);
                    return true;
                  }
                  core.setFailed(`Could not record ${rec.name} ${rec.path} on ${org}'s linked artifacts page ${recordFailureDetail(status, msg, org, ownerType)}`);
                  return false;
                }
              }
              core.info(`Recorded ${storageRecords.length} artifact(s) on ${org}'s linked artifacts page`);
              return true;
            };

            // Downloads live on the dl.<host> subdomain -- buildhost dispatches
            // services by the first label of the request Host.
            const dlBase = (() => {
              const u = new URL(server);
              u.host = `dl.${u.host}`;
              return u.origin;
            })();

            // Streaming file hash (the TS action injects no `crypto` global;
            // require is the documented route to node modules).
            const crypto = require("crypto");
            const fileSHA256 = (p: string): Promise<string> => new Promise((resolve, reject) => {
              const hash = crypto.createHash("sha256");
              fs.createReadStream(p)
                .on("error", reject)
                .on("data", (chunk: Buffer) => hash.update(chunk))
                .on("end", () => resolve(hash.digest("hex")));
            });

            // Discover matrix artifacts: files named <binary>_<os>_<arch>[.exe].
            // <binary> is the cmd/ leaf name from go-toolchain and may contain
            // hyphens (e.g. log-streamer-client); os and arch are the trailing
            // two underscore-separated tokens.
            const artifactRe = /^(.+)_([a-z]+)_([a-z0-9]+)$/;
            const files = fs.readdirSync(sourceDir).filter((f) => {
              const full = path.join(sourceDir, f);
              if (fs.lstatSync(full).isSymbolicLink()) return false;
              if (!fs.statSync(full).isFile()) return false;
              if (f === "checksums.txt" || f.endsWith(".zip")) return false;
              return artifactRe.test(f.replace(/\.exe$/, ""));
            });

            if (files.length === 0) {
              core.setFailed(`No matrix artifacts matching '<binary>_{os}_{arch}' found`);
              core.info(`Files: ${fs.readdirSync(sourceDir).join(", ")}`);
              return;
            }

            // Map a built binary to its buildhost project. A binary named exactly
            // after the repo publishes flat as "<repo>"; every other binary nests
            // under "<repo>/<binary>", stripping a redundant leading "<repo>-".
            const projectForBinary = (binary: string): string => {
              if (binary === project) return project;
              if (binary.startsWith(`${project}-`)) return `${project}/${binary.slice(project.length + 1)}`;
              return `${project}/${binary}`;
            };

            // Group artifacts by destination project.
            type Item = { file: string; os: string; arch: string };
            const groups = new Map<string, Item[]>();
            for (const file of files) {
              const m = file.replace(/\.exe$/, "").match(artifactRe)!;
              const [, binary, fileOs, arch] = m;
              const proj = projectForBinary(binary);
              const list = groups.get(proj) ?? [];
              list.push({ file, os: fileOs, arch });
              groups.set(proj, list);
            }
            core.info(`Found ${files.length} artifact(s) across ${groups.size} project(s): ${[...groups.keys()].join(", ")}`);

            const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));

            // Buildhost runs behind a CDN/reverse proxy and is redeployed with
            // rolling updates. During a deploy window the edge can briefly emit a
            // transient 5xx, a connection error, or an empty-body 404 (an
            // origin/proxy 404 -- distinct from the app's own 404, which always
            // carries a JSON body). Retry those with backoff so a buildhost deploy
            // never hard-fails a publish. Any 4xx that carries a body (including a
            // genuine "project not found") returns at once for the caller to act on.
            const isTransient = (status: number, text: string): boolean =>
              status >= 500 || (status === 404 && text.trim() === "");

            const api = async (method: string, urlPath: string, body?: string | Buffer) => {
              const headers: Record<string, string> = { Authorization: `Bearer ${token}` };
              if (typeof body === "string") headers["Content-Type"] = "application/json";
              else if (body) headers["Content-Type"] = "application/octet-stream";
              const maxAttempts = 5;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  const resp = await fetch(`${server}${urlPath}`, { method, headers, body });
                  const text = await resp.text();
                  if (attempt === maxAttempts || !isTransient(resp.status, text)) {
                    return { status: resp.status, text };
                  }
                  core.warning(`${method} ${urlPath} -> HTTP ${resp.status} (transient; attempt ${attempt}/${maxAttempts}); retrying`);
                } catch (e) {
                  const msg = e instanceof Error ? e.message : String(e);
                  if (attempt === maxAttempts) {
                    return { status: 0, text: `request failed after ${maxAttempts} attempts: ${msg}` };
                  }
                  core.warning(`${method} ${urlPath} -> ${msg} (network error; attempt ${attempt}/${maxAttempts}); retrying`);
                }
                await sleep(1000 * 2 ** (attempt - 1));
              }
              return { status: 0, text: "unreachable" };
            };

            const releaseBody = () => JSON.stringify({
              git_branch: gitBranch, git_commit: gitCommit,
              ...(version.length > 0 ? { version } : {}),
              // Empty input sends nothing (stored setting untouched); a set
              // value is asserted on every publish. An older server ignores
              // the unknown field.
              ...(inputBrewService.length > 0 ? { create_service: inputBrewService === 'true' } : {}),
              ...(inputDefaultBranch.length > 0 ? { default_branch: inputDefaultBranch } : {}),
            });

            // Resolve a release version from a create-release response (201 new,
            // 409 existing). Returns null and fails the action on any other status.
            const releaseVersionFrom = (proj: string, resp: { status: number; text: string }): string | null => {
              if (resp.status === 201) return JSON.parse(resp.text).version;
              if (resp.status === 409) {
                if (version.length === 0) { core.setFailed(`Release exists for ${proj}, no explicit version`); return null; }
                return version;
              }
              core.setFailed(`Create release for ${proj} failed (${resp.status}): ${resp.text}`);
              return null;
            };

            // Upload every os/arch artifact for a release, then publish it.
            // When the server supports hash references, byte-identical files
            // (e.g. go-toolchain's cosmo slot copies) transfer once: the first
            // slot of each hash does the full PUT exactly as before, the rest
            // send an empty-body PUT naming the hash. Without the capability
            // the request sequence is byte-identical to the pre-feature action.
            const uploadAndPublish = async (proj: string, releaseVersion: string, items: { file: string; os: string; arch: string }[]) => {
              const uploadedHash = new Map<string, string>(); // sha256 -> first uploaded file
              for (const { file, os: fileOs, arch } of items) {
                const slot = `/api/v1/projects/${proj}/releases/${releaseVersion}/artifacts/${fileOs}/${arch}?kind=binary`;
                // Hashed unconditionally now: hash-reference uploads need it
                // only when the server advertises them, but the storage record
                // needs it always. It is one streaming read of a file this loop
                // is about to read anyway.
                const sum = await fileSHA256(path.join(sourceDir, file));
                const record = () => storageRecords.push({
                  name: proj,
                  version: releaseVersion,
                  digest: `sha256:${sum}`,
                  registry_url: server,
                  repository: proj,
                  path: `${fileOs}/${arch}`,
                  artifact_url: `${dlBase}/${proj}?v=${encodeURIComponent(releaseVersion)}&os=${fileOs}&arch=${arch}&debug=1`,
                });
                if (canHashRef && uploadedHash.has(sum)) {
                  const ref = await api("PUT", `${slot}&upload_sha256=${sum}`);
                  if (ref.status === 201) {
                    core.info(`Registered ${proj} ${fileOs}/${arch} by hash (identical to ${uploadedHash.get(sum)})`);
                    record();
                    continue;
                  }
                  if (ref.status === 409) { core.setFailed(`Upload ${proj} ${fileOs}/${arch} failed (${ref.status}): ${ref.text}`); return false; }
                  // E.g. a 404 for a blob evicted since the first slot: the
                  // bytes are right here, send them the classic way.
                  core.warning(`Hash-reference upload ${proj} ${fileOs}/${arch} returned ${ref.status}; falling back to a full upload`);
                }
                const body = fs.readFileSync(path.join(sourceDir, file));
                const r = await api("PUT", slot, body);
                if (r.status !== 201) { core.setFailed(`Upload ${proj} ${fileOs}/${arch} failed (${r.status}): ${r.text}`); return false; }
                uploadedHash.set(sum, file);
                record();
                core.info(`Uploaded ${proj} ${fileOs}/${arch}`);
              }
              const pub = await api("POST", `/api/v1/projects/${proj}/releases/${releaseVersion}/publish`);
              if (pub.status !== 200) { core.setFailed(`Publish ${proj} failed (${pub.status}): ${pub.text}`); return false; }
              core.info(`Published ${proj}/${releaseVersion} (${items.length} artifacts) to ${server}`);
              return true;
            };

            const groupList = [...groups.entries()];

            // BACKWARD-COMPAT SHIM (transitional — remove in a few weeks, once every
            // target buildhost server authorizes slash-namespaced projects): a server
            // that predates namespace support rejects a namespaced project with
            // 404/403. Probe the first namespaced group up front; if it is rejected,
            // publish the old single-project layout instead (all `<repo>_<os>_<arch>`
            // artifacts flat to `<repo>`), so this action never regresses a repo while
            // the rollout is in flight. The probe's create-release is reused below, so
            // an up-to-date server gets no stray release. Single-binary repos publish
            // flat to `<repo>` either way; up-to-date servers never fall back.
            const created = new Map<string, { status: number; text: string }>();
            const firstNs = groupList.find(([p]) => p.includes("/"));
            if (firstNs) {
              const [proj] = firstNs;
              const probe = await api("POST", `/api/v1/projects/${proj}/releases`, releaseBody());
              if (probe.status === 404 || probe.status === 403) {
                core.warning(`Server rejected namespaced project '${proj}' (HTTP ${probe.status}); falling back to the legacy flat '${project}' layout. Upgrade buildhost to enable per-binary projects.`);
                const re = new RegExp(`^${project}_([a-z]+)_([a-z0-9]+)$`);
                const legacy: { file: string; os: string; arch: string }[] = [];
                for (const file of files) {
                  const m = file.replace(/\.exe$/, "").match(re);
                  if (m) legacy.push({ file, os: m[1], arch: m[2] });
                }
                if (legacy.length === 0) {
                  core.setFailed(`Server does not support namespaced projects, and no artifacts match the legacy '${project}_{os}_{arch}' layout`);
                  return;
                }
                const rv = releaseVersionFrom(project, await api("POST", `/api/v1/projects/${project}/releases`, releaseBody()));
                if (rv === null) return;
                core.info(`Release: ${project}/${rv} (legacy flat layout)`);
                if (!(await uploadAndPublish(project, rv, legacy))) return;
                core.setOutput('deployment_url', `${server}/projects/${project}/releases/${rv}`);
                await postStorageRecords();
                return;
              }
              created.set(proj, probe);
            }

            // Namespaced path: publish each <repo>/<binary> project independently.
            const published: { proj: string; rv: string }[] = [];
            for (const [proj, items] of groupList) {
              const createResp = created.get(proj) ?? await api("POST", `/api/v1/projects/${proj}/releases`, releaseBody());
              const rv = releaseVersionFrom(proj, createResp);
              if (rv === null) return;
              core.info(`Release: ${proj}/${rv}`);
              if (!(await uploadAndPublish(proj, rv, items))) return;
              published.push({ proj, rv });
            }

            // Live URL for the GitHub Deployment status: the release page for
            // a single published project, the primary project's page for a
            // multi-project fan-out (primary = the group matching the
            // repo-level project name, else the first group).
            if (published.length === 1) {
              core.setOutput('deployment_url', `${server}/projects/${published[0].proj}/releases/${published[0].rv}`);
            } else if (published.length > 1) {
              const primary = published.find((p) => p.proj === project) ?? published[0];
              core.setOutput('deployment_url', `${server}/projects/${primary.proj}`);
            }

            await postStorageRecords();
          })();

    # Terminal status for the GitHub Deployment created above; runs even when
    # the publish failed so the deployment is marked failure instead of
    # dangling in_progress. Never fails the action.
    - name: Finish GitHub Deployment
      id: deployment-status
      if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            try {
              const publishOutcome: string = "${{ steps.publish.outcome }}";
              const ok = publishOutcome === 'success';
              const environmentUrl: string = "${{ steps.publish.outputs.deployment_url }}";
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
                state: ok ? 'success' : 'failure',
                log_url: runUrl,
                ...(ok && environmentUrl !== '' ? { environment_url: environmentUrl } : {}),
                description: ok ? 'Published to buildhost' : 'buildhost publish failed',
              });
              core.info(`GitHub Deployment marked ${ok ? 'success' : 'failure'}`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not post the terminal GitHub Deployment status (${msg}); the deployment would be left stuck in_progress`);
            }
          })();
