name: Publish to Buildhost
version: 1
description: Publish go-toolchain matrix binaries to a buildhost registry using GHA OIDC, from a GHA run artifact or a local directory.

inputs:
  server:
    description: 'Buildhost server URL'
    required: false
    default: 'https://pazer.build'
  project:
    description: 'Project name (defaults to the repository name)'
    required: false
  artifact_name:
    description: 'GHA run artifact name (defaults to go-build from go-toolchain); ignored when path is set'
    required: false
    default: 'go-build'
  path:
    description: 'Local directory containing the release binaries to publish, resolved relative to the workspace. When set, the run''s artifacts are NOT downloaded and the artifact_name input is ignored; files are read from this directory instead (no actions: read permission needed; the publish script never reads GITHUB_TOKEN in this mode, though the GitHub Deployment steps use github.token and require deployments: write).'
    required: false
  version:
    description: 'Release version (omit for auto-versioned projects)'
    required: false
  git_branch:
    description: 'Git branch (defaults to GITHUB_REF_NAME)'
    required: false
  git_commit:
    description: 'Git commit SHA (defaults to GITHUB_SHA)'
    required: false
  create_service:
    description: >-
      Declare that the published binary runs as a background service ('true'
      or 'false'); each download format materializes it its own way (brew
      formulas gain a `service do` block, on-the-fly debs ship a systemd
      user unit). Empty (the default) sends nothing, leaving the stored
      project setting untouched -- byte-identical requests to before this
      input existed. Applies to every project this publish creates a release
      for (the repo project and any <repo>/<binary> sub-projects).
    required: false
    default: ''
  default_branch:
    description: >-
      The repo's default branch (e.g. 'main'). When set, the apex "latest"
      tracks this branch for each published project -- a manual override for
      publishers whose default branch the server cannot learn itself (private
      repos it cannot reach, non-GitHub publishers). Empty (the default)
      sends nothing, leaving the stored project setting untouched --
      byte-identical requests to before this input existed. Applies to every
      project this publish creates a release for.
    required: false
    default: ''
  deployment_environment:
    description: >-
      GitHub Deployment environment name (defaults to `buildhost/<project>`).
    required: false
    default: ''
  deployment_ref:
    description: >-
      Ref the GitHub Deployment is created against (defaults to git_commit, then
      GITHUB_SHA). Pass a BRANCH NAME to make the publish appear in the branch
      and PR deployment views: GitHub stores this string verbatim, and a
      deployment whose ref is a bare SHA belongs to no branch, so those views
      read "This branch has not been deployed". A branch here still fills the
      deployment's `sha` (GitHub resolves it), so the commit-level association
      survives. Separate from git_commit because that one is the release's
      recorded commit and has to stay a real SHA.
      See docs/github-deployments.md.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    # Registering the publish as a GitHub Deployment is part of publishing, not
    # an add-on: it has no opt-out input and a failure fails the step. Warning
    # and continuing was an opt-out by neglect -- seven of the eight callers had
    # been skipping deployments entirely, each one green, because nobody reads a
    # warning in a passing run. The calling job needs `deployments: write`
    # (ADDITIVE -- a job-level permissions block replaces the workflow-level one).
    - name: Create GitHub Deployment
      id: deployment
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            core.setOutput('deployment_id', '');
            // A deployment claims the publish is live at a reachable URL, which is false for a loopback server. Not an opt-out: see docs/github-deployments.md.
            const deployServer: string = "${{ inputs.server }}";
            const deployHost: string = new URL(deployServer).hostname;
            // this check finds a target nothing outside the runner can reach
            if (deployHost === "localhost" || deployHost === "127.0.0.1" || deployHost === "::1" || !deployServer.startsWith("https://")) {
              // a loopback or plain-http target has nothing true to register as live
              core.info(`Skipping the GitHub Deployment: ${deployServer} is not a reachable https server, so its deployment URL would point nowhere`);
              return;
            }
            try {
              const inputProject: string = "${{ inputs.project }}";
              const project: string = inputProject || github.repository.split('/').pop()!;
              const envInput: string = "${{ inputs.deployment_environment }}";
              const environment: string = envInput || `buildhost/${project}`;
              const inputCommit: string = "${{ inputs.git_commit }}";
              // A bare SHA belongs to no branch, so GitHub's branch and PR deployment views report the branch as never deployed; pass a branch name to surface there.
              const deploymentRefInput: string = "${{ inputs.deployment_ref }}";
              // a bare SHA belongs to no branch, so GitHub's branch/PR deployment views show it as never deployed -- pass a branch name here to fix that
              const ref: string = deploymentRefInput || inputCommit || context.sha;
              const inputBranch: string = "${{ inputs.git_branch }}";
              const branch: string = inputBranch || github.ref_name || '';
              const defaultBranch: string = context.payload.repository?.default_branch ?? '';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              // required_contexts and auto_merge are load-bearing and their API defaults both break this (docs/github-deployments.md); a 2xx carrying no id is "no deployment".
              const dep = await octokit.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                environment,
                // the API default would try to merge the default branch into ref
                auto_merge: false,
                // the API default is "every commit status", and the org's all-builds status is still pending on this sha mid-run -> 409 Conflict
                required_contexts: [],
                transient_environment: false,
                production_environment: defaultBranch !== '' && branch === defaultBranch,
                description: `buildhost publish of ${project}`.slice(0, 140),
              });
              const id = (dep.data as any)?.id;
              // a 2xx response without an id (e.g. the 202 auto-merge shape) counts as no deployment
              if (typeof id !== 'number') {
                core.setFailed(`GitHub Deployment not created (HTTP ${dep.status}): the API returned no deployment id`);
                return;
              }
              core.setOutput('deployment_id', String(id));
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: id,
                state: 'in_progress',
                log_url: runUrl,
                description: 'Publishing to buildhost',
              });
              core.info(`Created GitHub Deployment ${id} in environment '${environment}'`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not create the GitHub Deployment (${msg}). Add 'deployments: write' to this job's permissions block -- job-level permissions REPLACE workflow-level ones, so add it alongside the ones the job already declares. Registering the publish is part of publishing and cannot be turned off.`);
            }
          })();

    - id: publish
      uses: wow-look-at-my/actions@typescript#latest
      env:
        # Only artifact mode (path unset) talks to the GitHub API from THIS
        # step; path mode gets no token at all. (The optional deployment steps
        # authenticate separately, via the typescript action's own
        # github-token input default -- never via this env var.)
        GITHUB_TOKEN: ${{ inputs.path == '' && github.token || '' }}
      with:
        script: |
          const { recordReleaseArtifacts } = require("${{ github.action_path }}/../lib/storage-record.ts") as typeof import("${{ github.action_path }}/../lib/storage-record");
          await (async () => {
            const inputProject: string = "${{ inputs.project }}";
            const inputVersion: string = "${{ inputs.version }}";
            const inputBranch: string = "${{ inputs.git_branch }}";
            const inputCommit: string = "${{ inputs.git_commit }}";
            const artifactName: string = "${{ inputs.artifact_name }}";
            const inputPath: string = "${{ inputs.path }}";
            const inputBrewService: string = "${{ inputs.create_service }}";
            if (inputBrewService !== '' && inputBrewService !== 'true' && inputBrewService !== 'false') {
              core.setFailed(`create_service must be 'true', 'false', or empty; got '${inputBrewService}'`);
              return;
            }
            const inputDefaultBranch: string = "${{ inputs.default_branch }}";

            const server = "${{ inputs.server }}";
            const project = inputProject.length > 0 ? inputProject : github.repository.split("/").pop()!;
            const version = inputVersion;
            const gitBranch = inputBranch.length > 0 ? inputBranch : github.ref_name;
            const gitCommit = inputCommit.length > 0 ? inputCommit : github.sha;

            // `path` mode reads a local directory as-is: no artifact download, no GitHub API call, GITHUB_TOKEN never read, so the caller needs no `actions: read`. Artifact mode (the default) downloads and unzips the run's `artifact_name`.
            let sourceDir: string;
            if (inputPath.length > 0) {
              // path mode reads a local directory as-is -- no GHA artifact download, no GitHub API call, and GITHUB_TOKEN is never read, so the caller needs no actions: read permission
              sourceDir = path.resolve(env.GITHUB_WORKSPACE || process.cwd(), inputPath);
              if (!fs.existsSync(sourceDir) || !fs.statSync(sourceDir).isDirectory()) {
                core.setFailed(`Binaries directory '${sourceDir}' (from the 'path' input) does not exist or is not a directory`);
                return;
              }
              if (fs.readdirSync(sourceDir).length === 0) {
                core.setFailed(`Binaries directory '${sourceDir}' (from the 'path' input) is empty`);
                return;
              }
              core.info(`Publishing from local directory ${sourceDir} (GHA artifact download skipped)`);
            } else {
              // the default: downloads the run's artifact_name artifact and unzips it
              sourceDir = path.join(os.tmpdir(), "buildhost-publish");
              fs.mkdirSync(sourceDir, { recursive: true });

              // Download artifact via octokit
              const oct = octokit(process.env.GITHUB_TOKEN!);
              const [owner, repo] = github.repository.split("/");
              const { data: { artifacts } } = await oct.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: github.run_id,
              });
              const artifact = artifacts.find((a: any) => a.name === artifactName);
              if (!artifact) { core.setFailed(`Artifact '${artifactName}' not found in run`); return; }

              const { data: zip } = await oct.rest.actions.downloadArtifact({
                owner, repo, artifact_id: artifact.id, archive_format: "zip",
              });
              const zipPath = path.join(sourceDir, "artifact.zip");
              fs.writeFileSync(zipPath, Buffer.from(zip as ArrayBuffer));
              await exec.exec("unzip", ["-o", zipPath, "-d", sourceDir]);
            }

            // Mint OIDC token for buildhost
            const idTokenUrl = env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const idTokenBearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!idTokenUrl || !idTokenBearer) {
              core.setFailed("OIDC not available. Add 'permissions: { id-token: write }'.");
              return;
            }
            const idResp = await fetch(`${idTokenUrl}&audience=${server}`, {
              headers: { Authorization: `Bearer ${idTokenBearer}` },
            });
            const token: string = ((await idResp.json()) as { value: string }).value;
            if (!token) { core.setFailed("Failed to obtain OIDC token"); return; }

            // Recording is PART of publishing: accumulated as artifacts are accepted, posted before this step returns, no opt-out input, and a failure fails the publish -- a warn-and-continue would leave it green while the artifacts page fell behind reality.
            const uploadedSlots: import("${{ github.action_path }}/../lib/storage-record").PublishedArtifact[] = [];
            const drainStorageRecords = async (): Promise<boolean> =>
              recordReleaseArtifacts(octokit, core, context, { server, artifacts: uploadedSlots });

            // Streaming file hash; the TS action injects no `crypto` global, so require is the documented route.
            const crypto = require("crypto");
            const fileSHA256 = (p: string): Promise<string> => new Promise((resolve, reject) => {
              const hash = crypto.createHash("sha256");
              fs.createReadStream(p)
                .on("error", reject)
                .on("data", (chunk: Buffer) => hash.update(chunk))
                .on("end", () => resolve(hash.digest("hex")));
            });

            // Matrix artifacts are named <binary>_<os>_<arch>[.exe], where <binary> is go-toolchain's cmd/ leaf name and may contain hyphens, so os and arch are the trailing two tokens.
            const artifactRe = /^(.+)_([a-z]+)_([a-z0-9]+)$/;
            const files = fs.readdirSync(sourceDir).filter((f) => {
              const full = path.join(sourceDir, f);
              if (fs.lstatSync(full).isSymbolicLink()) return false;
              if (!fs.statSync(full).isFile()) return false;
              if (f === "checksums.txt" || f.endsWith(".zip")) return false;
              return artifactRe.test(f.replace(/\.exe$/, ""));
            });

            if (files.length === 0) {
              core.setFailed(`No matrix artifacts matching '<binary>_{os}_{arch}' found`);
              core.info(`Files: ${fs.readdirSync(sourceDir).join(", ")}`);
              return;
            }

            // A binary named exactly after the repo publishes flat as "<repo>"; every other one nests under "<repo>/<binary>", stripping a redundant leading "<repo>-".
            const projectForBinary = (binary: string): string => {
              if (binary === project) return project;
              if (binary.startsWith(`${project}-`)) return `${project}/${binary.slice(project.length + 1)}`;
              return `${project}/${binary}`;
            };

            // Group artifacts by destination project.
            type Item = { file: string; os: string; arch: string };
            const groups = new Map<string, Item[]>();
            for (const file of files) {
              const m = file.replace(/\.exe$/, "").match(artifactRe)!;
              const [, binary, fileOs, arch] = m;
              const proj = projectForBinary(binary);
              const list = groups.get(proj) ?? [];
              list.push({ file, os: fileOs, arch });
              groups.set(proj, list);
            }
            core.info(`Found ${files.length} artifact(s) across ${groups.size} project(s): ${[...groups.keys()].join(", ")}`);

            const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));

            // A rolling deploy makes the edge briefly emit a 5xx or an EMPTY-BODY 404 -- the app's own 404 always carries JSON -- so those retry while any 4xx with a body returns at once.
            const isTransient = (status: number, text: string): boolean =>
              status >= 500 || (status === 404 && text.trim() === "");

            // retries a transient failure with backoff so a rolling buildhost deploy never hard-fails the publish
            const api = async (method: string, urlPath: string, body?: string | Buffer) => {
              const headers: Record<string, string> = { Authorization: `Bearer ${token}` };
              if (typeof body === "string") headers["Content-Type"] = "application/json";
              else if (body) headers["Content-Type"] = "application/octet-stream";
              const maxAttempts = 5;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  const resp = await fetch(`${server}${urlPath}`, { method, headers, body });
                  const text = await resp.text();
                  if (attempt === maxAttempts || !isTransient(resp.status, text)) {
                    return { status: resp.status, text };
                  }
                  core.warning(`${method} ${urlPath} -> HTTP ${resp.status} (transient; attempt ${attempt}/${maxAttempts}); retrying`);
                } catch (e) {
                  const msg = e instanceof Error ? e.message : String(e);
                  if (attempt === maxAttempts) {
                    return { status: 0, text: `request failed after ${maxAttempts} attempts: ${msg}` };
                  }
                  core.warning(`${method} ${urlPath} -> ${msg} (network error; attempt ${attempt}/${maxAttempts}); retrying`);
                }
                await sleep(1000 * 2 ** (attempt - 1));
              }
              return { status: 0, text: "unreachable" };
            };

            const releaseBody = () => JSON.stringify({
              git_branch: gitBranch, git_commit: gitCommit,
              ...(version.length > 0 ? { version } : {}),
              // Empty sends nothing and leaves the stored setting alone; a set value is asserted on every publish, and an older server ignores the unknown field.
              ...(inputBrewService.length > 0 ? { create_service: inputBrewService === 'true' } : {}),
              // an older server ignores this unknown field
              ...(inputDefaultBranch.length > 0 ? { default_branch: inputDefaultBranch } : {}),
            });

            // 201 new, 409 existing; any other status returns null and fails the action.
            const releaseVersionFrom = (proj: string, resp: { status: number; text: string }): string | null => {
              if (resp.status === 201) return JSON.parse(resp.text).version;
              if (resp.status === 409) {
                if (version.length === 0) { core.setFailed(`Release exists for ${proj}, no explicit version`); return null; }
                return version;
              }
              core.setFailed(`Create release for ${proj} failed (${resp.status}): ${resp.text}`);
              return null;
            };

            // Uploads every os/arch slot, then publishes. Identical bytes under several slot names is the NORMAL case, not an edge -- a cosmo build emits one APE named for every platform -- so slots are grouped by content and each group transfers once.
            const uploadAndPublish = async (proj: string, releaseVersion: string, items: { file: string; os: string; arch: string }[]) => {
              const slotURL = (os: string, arch: string) =>
                `/api/v1/projects/${proj}/releases/${releaseVersion}/artifacts/${os}/${arch}?kind=binary`;

              // Hashed unconditionally: the storage record needs it for every slot, and it is one streaming read of a file this loop is about to read anyway.
              const byContent = new Map<string, { file: string; os: string; arch: string }[]>();
              for (const item of items) {
                const sum = await fileSHA256(path.join(sourceDir, item.file));
                byContent.set(sum, [...(byContent.get(sum) ?? []), item]);
              }

              for (const [sum, group] of [...byContent.entries()]) {
                const body = () => fs.readFileSync(path.join(sourceDir, group[0].file));
                const record = () => {
                  for (const { os: fileOs, arch } of group) {
                    uploadedSlots.push({ project: proj, version: releaseVersion, os: fileOs, arch, sha256: sum });
                  }
                };
                const oses = [...new Set(group.map((i) => i.os))];
                const arches = [...new Set(group.map((i) => i.arch))];

                // Fan-out: when the group's slots are exactly the product of the platforms it covers -- what a cosmo build always produces -- buildhost makes every row from one streamed body, in one transaction.
                if (oses.length * arches.length === group.length) {
                  const r = await api("PUT", slotURL(oses.join(","), arches.join(",")), body());
                  if (r.status !== 201) { core.setFailed(`Upload ${proj} ${oses.join(",")}/${arches.join(",")} failed (${r.status}): ${r.text}`); return false; }
                  record();
                  core.info(`Uploaded ${proj} ${oses.join(",")}/${arches.join(",")} (${group.length} slot(s), one transfer)`);
                  continue;
                }

                // A ragged slot set the cartesian grammar cannot express (e.g. every platform but windows/arm64): send the bytes once, then register the rest against the stored blob by hash.
                const [first, ...rest] = group;
                const r = await api("PUT", slotURL(first.os, first.arch), body());
                if (r.status !== 201) { core.setFailed(`Upload ${proj} ${first.os}/${first.arch} failed (${r.status}): ${r.text}`); return false; }
                core.info(`Uploaded ${proj} ${first.os}/${first.arch}`);
                for (const { os: fileOs, arch } of rest) {
                  const ref = await api("PUT", `${slotURL(fileOs, arch)}&upload_sha256=${sum}`);
                  if (ref.status === 201) { core.info(`Registered ${proj} ${fileOs}/${arch} by hash`); continue; }
                  if (ref.status === 409) { core.setFailed(`Upload ${proj} ${fileOs}/${arch} failed (${ref.status}): ${ref.text}`); return false; }
                  // The blob was evicted between the two requests: the bytes are right here.
                  core.warning(`Hash-reference upload ${proj} ${fileOs}/${arch} returned ${ref.status}; sending the bytes`);
                  const full = await api("PUT", slotURL(fileOs, arch), body());
                  if (full.status !== 201) { core.setFailed(`Upload ${proj} ${fileOs}/${arch} failed (${full.status}): ${full.text}`); return false; }
                }
                record();
              }
              const pub = await api("POST", `/api/v1/projects/${proj}/releases/${releaseVersion}/publish`);
              if (pub.status !== 200) { core.setFailed(`Publish ${proj} failed (${pub.status}): ${pub.text}`); return false; }
              core.info(`Published ${proj}/${releaseVersion} (${items.length} artifacts) to ${server}`);
              return true;
            };

            const groupList = [...groups.entries()];

            // Publish each <repo>/<binary> project independently.
            const published: { proj: string; rv: string }[] = [];
            for (const [proj, items] of groupList) {
              const rv = releaseVersionFrom(proj, await api("POST", `/api/v1/projects/${proj}/releases`, releaseBody()));
              if (rv === null) return;
              core.info(`Release: ${proj}/${rv}`);
              if (!(await uploadAndPublish(proj, rv, items))) return;
              published.push({ proj, rv });
            }

            // Live URL for the deployment status: the release page for one project, else the primary group's project page (the one matching the repo-level name, else the first).
            if (published.length === 1) {
              core.setOutput('deployment_url', `${server}/projects/${published[0].proj}/releases/${published[0].rv}`);
            } else if (published.length > 1) {
              // primary is the group matching the repo-level project name, else the first group
              const primary = published.find((p) => p.proj === project) ?? published[0];
              core.setOutput('deployment_url', `${server}/projects/${primary.proj}`);
            }

            await drainStorageRecords();
          })();

    # Terminal status for the GitHub Deployment created above; runs even when
    # the publish failed so the deployment is marked failure instead of
    # dangling in_progress. Never fails the action.
    - name: Finish GitHub Deployment
      id: deployment-status
      if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            try {
              const publishOutcome: string = "${{ steps.publish.outcome }}";
              const ok = publishOutcome === 'success';
              const environmentUrl: string = "${{ steps.publish.outputs.deployment_url }}";
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
                state: ok ? 'success' : 'failure',
                log_url: runUrl,
                ...(ok && environmentUrl !== '' ? { environment_url: environmentUrl } : {}),
                description: ok ? 'Published to buildhost' : 'buildhost publish failed',
              });
              core.info(`GitHub Deployment marked ${ok ? 'success' : 'failure'}`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not post the terminal GitHub Deployment status (${msg}); the deployment would be left stuck in_progress`);
            }
          })();
