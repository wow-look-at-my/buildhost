name: Buildhost - Publish Release
description: Publishes a release (makes it immutable) in a Buildhost registry.

inputs:
  server:
    description: 'Buildhost server URL'
    required: false
    default: 'https://pazer.build'
  token:
    description: 'API token with write scope, or omit to use OIDC'
    required: false
    default: ''
  project:
    description: 'Project name'
    required: true
  version:
    description: 'Release version to publish'
    required: true

outputs:
  response:
    description: 'JSON response from the API'
    value: ${{ steps.publish.outputs.response }}

runs:
  using: composite
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    - id: publish
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            const server: string = "${{ inputs.server }}";
            let token: string = "${{ inputs.token }}";
            if (!token) {
              const url = env.ACTIONS_ID_TOKEN_REQUEST_URL;
              const bearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
              if (url && bearer) {
                const r = await fetch(`${url}&audience=${server}`, { headers: { Authorization: `Bearer ${bearer}` } });
                token = ((await r.json()) as { value: string }).value ?? '';
              }
            }
            const project: string = "${{ inputs.project }}";
            const version: string = "${{ inputs.version }}";

            const resp = await fetch(`${server}/api/v1/projects/${project}/releases/${version}/publish`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}` },
            });
            const text = await resp.text();
            if (!resp.ok) { core.setFailed(`HTTP ${resp.status}: ${text}`); return; }

            core.info(JSON.stringify(JSON.parse(text), null, 2));
            core.setOutput('response', text);

            // Recording what buildhost now holds is part of publishing. This
            // composite is the final step of the create/upload/publish chain
            // assembled by publishers that do not use buildhost-publish, so
            // without this that whole path stores artifacts and records
            // nothing. The publish response carries the artifacts it just made
            // public; each becomes one storage record.
            type ReleaseBody = {
              version?: string;
              artifacts?: { os?: string; arch?: string; sha256?: string }[];
            };
            const published = JSON.parse(text) as ReleaseBody;
            const artifacts = published.artifacts ?? [];

            if (artifacts.length === 0) {
              core.setFailed(`Publishing ${project}/${version} returned no artifacts, so nothing can be recorded on the org's linked artifacts page. The publish endpoint returns them as of the buildhost release that added artifact-metadata recording -- this server is older than that, which is a version to upgrade rather than a condition to wait out. A publish that records nothing must not report success.`);
              return;
            }

            const host = new URL(server).hostname;
            if (host === "localhost" || host === "127.0.0.1" || host === "::1" || !server.startsWith("https://")) {
              core.info(`Skipping ${artifacts.length} storage record(s): ${server} is not a reachable https registry (the API accepts https URLs only)`);
              return;
            }

            const dl = (() => { const u = new URL(server); u.host = `dl.${u.host}`; return u.origin; })();
            const releaseVersion: string = published.version ?? version;
            const org = context.repo.owner;

            for (const a of artifacts) {
              const slot = `${a.os ?? ''}/${a.arch ?? ''}`;
              const sha: string = a.sha256 ?? '';
              if (sha === '') {
                core.setFailed(`Published artifact ${slot} carried no sha256; cannot record what buildhost stored`);
                return;
              }
              // debug=1 is the only download returning the uploaded bytes
              // verbatim -- buildhost strips and repackages on demand -- so it
              // is the one URL whose bytes hash to the recorded digest.
              const artifactURL = `${dl}/${project}?v=${encodeURIComponent(releaseVersion)}&os=${a.os ?? ''}&arch=${a.arch ?? ''}&debug=1`;
              if (artifactURL.length > 152) {
                core.setFailed(`Cannot record ${project} ${slot}: its artifact_url is ${artifactURL.length} chars, over the API's 152-char limit. Recording it without the URL would silently drop the only link back to the bytes the digest covers; shorten the project name or change the download URL scheme.`);
                return;
              }
              try {
                await octokit.request("POST /orgs/{org}/artifacts/metadata/storage-record", {
                  org,
                  name: project,
                  version: releaseVersion,
                  digest: `sha256:${sha}`,
                  registry_url: server,
                  repository: project,
                  path: slot,
                  artifact_url: artifactURL,
                  github_repository: context.repo.repo,
                  status: "active",
                  return_records: false,
                });
                core.info(`Recorded ${project} ${slot} sha256:${sha} on ${org}'s linked artifacts page`);
              } catch (e) {
                const status = (e as { status?: number }).status;
                const msg = e instanceof Error ? e.message : String(e);
                // A personal account has no linked artifacts page, so the
                // org-scoped endpoint 404s no matter what the token grants --
                // a property of the target, like the loopback skip above.
                // Checked only on a 404 (orgs pay no extra call) and fails
                // closed: an unreadable owner type leaves the failure standing.
                const ownerType = status === 404
                  ? await octokit.rest.users.getByUsername({ username: org }).then((r: { data: { type?: string } }) => r.data.type ?? "").catch(() => "")
                  : "";
                if (ownerType === "User") {
                  core.info(`Skipping the storage record(s): ${org} is a user account, which has no linked artifacts page`);
                  return;
                }
                core.setFailed(
                  status === 403 || status === 404
                    ? `Could not record ${project} ${slot} on ${org}'s linked artifacts page (HTTP ${status}: ${msg}). Either ${org} has no linked artifacts page, or this job's token lacks 'artifact-metadata: write' -- job-level permissions REPLACE workflow-level ones, so a job-level block must list it alongside the ones it already declares. Recording what buildhost stores is part of publishing and cannot be turned off.`
                    : `Could not record ${project} ${slot} on ${org}'s linked artifacts page (${msg})`,
                );
                return;
              }
            }
          })();
