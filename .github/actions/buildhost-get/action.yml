name: Buildhost - Get
description: Fetches a single resource from a Buildhost registry.

inputs:
  server:
    description: 'Buildhost server URL'
    required: false
    default: 'https://pazer.build'
  token:
    description: 'API token or omit to use OIDC (required for private projects)'
    required: false
    default: ''
  resource:
    description: 'Resource type: project | release'
    required: true
  project:
    description: 'Project name'
    required: true
  version:
    description: 'Release version (required for resource=release)'
    required: false
    default: ''

outputs:
  response:
    description: 'JSON response from the API'
    value: ${{ steps.get.outputs.response }}
  id:
    description: 'Resource ID'
    value: ${{ steps.get.outputs.id }}

runs:
  using: composite
  steps:
    - id: get
      uses: wow-look-at-my/actions@typescript#latest
      with:
        inputs: ${{ toJSON(inputs) }}
        script: |
          const lib = require(${{ toJSON(format('{0}/../lib/resources.ts', github.action_path)) }}) as typeof import(${{ toJSON(format('{0}/../lib/resources', github.action_path)) }});
          await lib.getResource({ core, github, context, octokit, exec, inputs, steps });
