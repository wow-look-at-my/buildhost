name: Buildhost - Publish Site
version: 1
description: Publish a static site to a Buildhost registry branch.

inputs:
  server:
    description: 'Buildhost server URL'
    required: false
    default: 'https://pazer.build'
  token:
    description: 'API token with write scope, or omit to use OIDC'
    required: false
    default: ''
  project:
    description: 'Project name (defaults to the repository name)'
    required: false
    default: ''
  branch:
    description: 'Branch name to publish the site under'
    required: true
  source_dir:
    description: 'Local directory to publish (mutually exclusive with artifact_name)'
    required: false
    default: ''
  artifact_name:
    description: 'GHA run artifact name to download and publish (mutually exclusive with source_dir)'
    required: false
    default: ''
  git_commit:
    description: 'Git commit SHA (defaults to github.sha)'
    required: false
    default: ''
  public:
    description: 'Serve the site publicly even when the source repo/project is private. The project itself (and any release artifacts) stays private; only this site branch is opened.'
    required: false
    default: 'false'
  create_deployment:
    description: >-
      Register this site publish as a GitHub Deployment in the calling repo
      (with a success status linking to the live site URL). Needs
      `deployments: write` in the calling job's permissions block; without it
      the step warns and skips -- deployments are additive and never fail the
      publish. Set 'false' to opt out (and silence the warning).
    required: false
    default: 'true'
  deployment_environment:
    description: >-
      GitHub Deployment environment name (defaults to
      `buildhost/<project>/<branch>`).
    required: false
    default: ''

outputs:
  response:
    description: 'JSON response from the API'
    value: ${{ steps.publish.outputs.response }}
  site_url:
    description: 'URL of the published site'
    value: ${{ steps.publish.outputs.site_url }}

runs:
  using: composite
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    # Best-effort GitHub Deployment registration: the site publish shows up in
    # the calling repo's Environments/Deployments UI with a link to the live
    # site. Requires `deployments: write` in the calling job; without it the
    # step warns and skips -- it can never fail the publish.
    - name: Create GitHub Deployment
      id: deployment
      if: ${{ inputs.create_deployment == 'true' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            core.setOutput('deployment_id', '');
            try {
              const projectInput: string = "${{ inputs.project }}";
              const project: string = projectInput || github.repository.split('/').pop()!;
              const branch: string = "${{ inputs.branch }}";
              const envInput: string = "${{ inputs.deployment_environment }}";
              const environment: string = envInput || `buildhost/${project}/${branch}`;
              const gitCommitInput: string = "${{ inputs.git_commit }}";
              const ref: string = gitCommitInput || context.sha;
              // PR-preview branches (pr-<n>, as deployed by the
              // buildhost-preview reusable workflow) are transient
              // environments: GitHub expects them to go away again.
              const transient = /^pr-\d+$/.test(branch);
              const defaultBranch: string = context.payload.repository?.default_branch ?? '';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              // required_contexts MUST be [] (the API default is "every commit
              // status", and the org's all-builds status is still pending on
              // this sha mid-run -> 409 Conflict); auto_merge MUST be false
              // (the API default would try to merge the default branch into
              // ref). A 2xx response without an id (e.g. the 202 auto-merge
              // shape) is treated as "no deployment".
              const dep = await octokit.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                environment,
                auto_merge: false,
                required_contexts: [],
                transient_environment: transient,
                production_environment: !transient && defaultBranch !== '' && branch === defaultBranch,
                description: `buildhost site publish of ${project} (branch ${branch})`.slice(0, 140),
              });
              const id = (dep.data as any)?.id;
              if (typeof id !== 'number') {
                core.warning(`GitHub Deployment not created (HTTP ${dep.status}); publishing without one`);
                return;
              }
              core.setOutput('deployment_id', String(id));
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: id,
                state: 'in_progress',
                log_url: runUrl,
                description: 'Publishing site to buildhost',
              });
              core.info(`Created GitHub Deployment ${id} in environment '${environment}'`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.warning(`Skipping GitHub Deployment (${msg}). Grant 'deployments: write' in the calling job's permissions block, or set create_deployment: 'false' to silence this warning.`);
            }
          })();

    - id: publish
      uses: wow-look-at-my/actions@typescript#latest
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        script: |
          await (async () => {
            const server: string = "${{ inputs.server }}";
            const sourceDir: string = "${{ inputs.source_dir }}";
            const artifactName: string = "${{ inputs.artifact_name }}";

            if (sourceDir && artifactName) {
              core.setFailed('Specify source_dir or artifact_name, not both'); return;
            }
            if (!sourceDir && !artifactName) {
              core.setFailed('Either source_dir or artifact_name is required'); return;
            }

            // Route inputs through string-typed locals before `||`. A bare
            // input literal substituted directly into `x || y` is statically
            // empty-or-not, which the typescript action rejects (TS2872/TS2873).
            const projectInput: string = "${{ inputs.project }}";
            const project: string = projectInput || github.repository.split('/').pop()!;
            const branch: string = "${{ inputs.branch }}";
            const gitCommitInput: string = "${{ inputs.git_commit }}";
            const gitCommit: string = gitCommitInput || github.sha;
            // Opt-in public flag. buildhost serves a site published with
            // X-Public-Site: true without a token even under a private project.
            const publicInput: string = "${{ inputs.public }}";
            const isPublic: string = publicInput === 'true' ? 'true' : 'false';

            // buildhost serves each service on its own subdomain and dispatches
            // by the first Host label, so the sites endpoint is sites.<domain>.
            const su = new URL(server);
            const sitesBase = `${su.protocol}//sites.${su.host}`;

            let token: string = "${{ inputs.token }}";
            if (!token) {
              const url = env.ACTIONS_ID_TOKEN_REQUEST_URL;
              const bearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
              if (url && bearer) {
                const r = await fetch(`${url}&audience=${server}`, { headers: { Authorization: `Bearer ${bearer}` } });
                token = ((await r.json()) as { value: string }).value || '';
              }
            }

            let body: Buffer;
            let contentType: string;
            if (artifactName) {
              const oct = octokit(process.env.GITHUB_TOKEN!);
              const [owner, repo] = github.repository.split('/');
              const { data: { artifacts } } = await oct.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: github.run_id });
              const artifact = artifacts.find((a: any) => a.name === artifactName);
              if (!artifact) { core.setFailed(`Artifact '${artifactName}' not found in run`); return; }
              const { data: zip } = await oct.rest.actions.downloadArtifact({ owner, repo, artifact_id: artifact.id, archive_format: 'zip' });
              body = Buffer.from(zip as ArrayBuffer);
              contentType = 'application/zip';
            } else {
              const tarPath = path.join(os.tmpdir(), 'site.tar.gz');
              await exec.exec('tar', ['-czf', tarPath, '-C', sourceDir, '.']);
              body = fs.readFileSync(tarPath);
              fs.unlinkSync(tarPath);
              contentType = 'application/gzip';
            }
            core.info(`Archive size: ${body.length} bytes`);

            const resp = await fetch(`${sitesBase}/${project}/branch/${branch}`, {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': contentType,
                'X-Git-Commit': gitCommit,
                'X-Public-Site': isPublic,
              },
              body,
            });
            const text = await resp.text();
            if (!resp.ok) { core.setFailed(`HTTP ${resp.status}: ${text}`); return; }

            const siteURL = `${sitesBase}/${project}/branch/${branch}/`;
            core.info(`Published site to ${siteURL}`);
            core.info(JSON.stringify(JSON.parse(text), null, 2));
            core.setOutput('response', text);
            core.setOutput('site_url', siteURL);
          })();

    # Terminal status for the GitHub Deployment created above; runs even when
    # the publish failed so the deployment is marked failure instead of
    # dangling in_progress. Never fails the action.
    - name: Finish GitHub Deployment
      id: deployment-status
      if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            try {
              const publishOutcome: string = "${{ steps.publish.outcome }}";
              const ok = publishOutcome === 'success';
              const environmentUrl: string = "${{ steps.publish.outputs.site_url }}";
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
                state: ok ? 'success' : 'failure',
                log_url: runUrl,
                ...(ok && environmentUrl !== '' ? { environment_url: environmentUrl } : {}),
                description: ok ? 'Site published to buildhost' : 'buildhost site publish failed',
              });
              core.info(`GitHub Deployment marked ${ok ? 'success' : 'failure'}`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.warning(`Could not update the GitHub Deployment status (${msg})`);
            }
          })();
