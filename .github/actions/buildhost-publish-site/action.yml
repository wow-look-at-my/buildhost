name: Buildhost - Publish Site
version: 2
description: >
  Publish a static site to a Buildhost registry branch. The upload strategy is
  picked from the server's advertised limits before anything is sent
  (GET /api/v1/server-info): archives at or under max_direct_upload_bytes go as
  the classic single PUT, larger ones go through a chunked upload session --
  so sites over a proxy's request-body cap (Cloudflare's edge rejects single
  requests over ~100 MB) publish instead of dying with a 413.

inputs:
  server:
    description: 'Buildhost server URL (apex; the sites subdomain is derived from it)'
    required: false
    default: 'https://pazer.build'
  token:
    description: 'API token with write scope, or omit to use OIDC'
    required: false
    default: ''
  project:
    description: 'Project name (defaults to the repository name)'
    required: false
    default: ''
  branch:
    description: 'Branch name to publish the site under'
    required: true
  source_dir:
    description: 'Local directory to publish (mutually exclusive with artifact_name)'
    required: false
    default: ''
  artifact_name:
    description: 'GHA run artifact name to download and publish (mutually exclusive with source_dir)'
    required: false
    default: ''
  git_commit:
    description: 'Git commit SHA (defaults to github.sha)'
    required: false
    default: ''
  deployment_ref:
    description: >-
      Ref the GitHub Deployment is created against (defaults to git_commit, then
      github.sha). Pass a BRANCH NAME to make the publish appear in the branch
      and PR deployment views: GitHub stores this string verbatim, and a
      deployment whose ref is a bare SHA belongs to no branch, so those views
      read "This branch has not been deployed". A branch here still fills the
      deployment's `sha` (GitHub resolves it), so the commit-level association
      survives. Separate from git_commit because that one is the site's recorded
      commit (X-Git-Commit) and has to stay a real SHA.
    required: false
    default: ''
  public:
    description: 'Serve the site publicly even when the source repo/project is private. The project itself (and any release artifacts) stays private; only this site branch is opened.'
    required: false
    default: 'false'
  chunk_size:
    description: >-
      Chunk size in bytes for large uploads (default 64 MiB, like the CLI's
      --chunk-size); 0 disables chunking entirely (always one direct request)
    required: false
    default: ''
  deployment_environment:
    description: >-
      GitHub Deployment environment name (defaults to
      `buildhost/<project>/<branch>`).
    required: false
    default: ''

outputs:
  response:
    description: 'JSON response from the API'
    value: ${{ steps.publish.outputs.response }}
  site_url:
    description: 'URL of the published site'
    value: ${{ steps.publish.outputs.site_url }}

runs:
  using: composite
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    # Registering the site publish as a GitHub Deployment is part of publishing,
    # not an add-on: no opt-out input, and a failure fails the step. See
    # buildhost-publish for why warn-and-continue was removed. The calling job
    # needs `deployments: write` (ADDITIVE -- a job-level permissions block
    # replaces the workflow-level one).
    - name: Create GitHub Deployment
      id: deployment
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            core.setOutput('deployment_id', '');
            // No true environment_url to assert against a loopback/non-https target -- a property of the target, not an opt-out; every real-server publish registers, and failure there is fatal. See docs/github-deployments.md.
            const deployServer: string = "${{ inputs.server }}";
            const deployHost: string = new URL(deployServer).hostname;
            if (deployHost === "localhost" || deployHost === "127.0.0.1" || deployHost === "::1" || !deployServer.startsWith("https://")) {
              core.info(`Skipping the GitHub Deployment: ${deployServer} is not a reachable https server, so its deployment URL would point nowhere`);
              return;
            }
            try {
              const projectInput: string = "${{ inputs.project }}";
              const project: string = projectInput || github.repository.split('/').pop()!;
              const branch: string = "${{ inputs.branch }}";
              const envInput: string = "${{ inputs.deployment_environment }}";
              const environment: string = envInput || `buildhost/${project}/${branch}`;
              const gitCommitInput: string = "${{ inputs.git_commit }}";
              // A bare SHA here belongs to no branch, so GitHub's branch and PR
              // deployment views report the branch as never deployed. Callers
              // that want the publish to surface there pass a branch name.
              const deploymentRefInput: string = "${{ inputs.deployment_ref }}";
              const ref: string = deploymentRefInput || gitCommitInput || context.sha;
              // PR-preview branches (pr-<n>, as deployed by the
              // buildhost-preview reusable workflow) are transient
              // environments: GitHub expects them to go away again.
              const transient = /^pr-\d+$/.test(branch);
              const defaultBranch: string = context.payload.repository?.default_branch ?? '';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              // required_contexts MUST be [] (the API default is "every commit
              // status", and the org's all-builds status is still pending on
              // this sha mid-run -> 409 Conflict); auto_merge MUST be false
              // (the API default would try to merge the default branch into
              // ref). A 2xx response without an id (e.g. the 202 auto-merge
              // shape) is treated as "no deployment".
              const dep = await octokit.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                environment,
                auto_merge: false,
                required_contexts: [],
                transient_environment: transient,
                production_environment: !transient && defaultBranch !== '' && branch === defaultBranch,
                description: `buildhost site publish of ${project} (branch ${branch})`.slice(0, 140),
              });
              const id = (dep.data as any)?.id;
              if (typeof id !== 'number') {
                core.setFailed(`GitHub Deployment not created (HTTP ${dep.status}): the API returned no deployment id`);
                return;
              }
              core.setOutput('deployment_id', String(id));
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: id,
                state: 'in_progress',
                log_url: runUrl,
                description: 'Publishing site to buildhost',
              });
              core.info(`Created GitHub Deployment ${id} in environment '${environment}'`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not create the GitHub Deployment (${msg}). Add 'deployments: write' to this job's permissions block -- job-level permissions REPLACE workflow-level ones, so add it alongside the ones the job already declares. Registering the publish is part of publishing and cannot be turned off.`);
            }
          })();

    - id: publish
      uses: wow-look-at-my/actions@typescript#latest
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        script: |
          const { recordSite } = require("${{ github.action_path }}/../lib/storage-record.ts") as typeof import("${{ github.action_path }}/../lib/storage-record");
          await (async () => {
            const server: string = "${{ inputs.server }}";
            const sourceDir: string = "${{ inputs.source_dir }}";
            const artifactName: string = "${{ inputs.artifact_name }}";

            if (sourceDir && artifactName) {
              core.setFailed('Specify source_dir or artifact_name, not both'); return;
            }
            if (!sourceDir && !artifactName) {
              core.setFailed('Either source_dir or artifact_name is required'); return;
            }

            // Route inputs through string-typed locals before `||`. A bare
            // input literal substituted directly into `x || y` is statically
            // empty-or-not, which the typescript action rejects (TS2872/TS2873).
            const projectInput: string = "${{ inputs.project }}";
            const project: string = projectInput || github.repository.split('/').pop()!;
            const branch: string = "${{ inputs.branch }}";
            const gitCommitInput: string = "${{ inputs.git_commit }}";
            const gitCommit: string = gitCommitInput || github.sha;
            // Opt-in public flag. buildhost serves a site published with
            // X-Public-Site: true without a token even under a private project.
            const publicInput: string = "${{ inputs.public }}";
            const isPublic: string = publicInput === 'true' ? 'true' : 'false';
            const chunkSizeInput: string = "${{ inputs.chunk_size }}";

            // buildhost serves each service on its own subdomain and dispatches
            // by the first Host label, so the sites endpoint is sites.<domain>.
            const su = new URL(server);
            const sitesBase = `${su.protocol}//sites.${su.host}`;

            let token: string = "${{ inputs.token }}";
            if (!token) {
              const url = env.ACTIONS_ID_TOKEN_REQUEST_URL;
              const bearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
              if (url && bearer) {
                const r = await fetch(`${url}&audience=${server}`, { headers: { Authorization: `Bearer ${bearer}` } });
                token = ((await r.json()) as { value: string }).value || '';
              }
            }

            // Build the archive on disk (never a whole-archive Buffer): a Blob
            // opened from the path lets fetch stream it with a correct
            // Content-Length, blob.slice() gives cheap per-chunk views, and a
            // Blob can be re-read, so retried attempts are safe.
            let archivePath: string;
            let contentType: string;
            if (artifactName) {
              const oct = octokit(process.env.GITHUB_TOKEN!);
              const [owner, repo] = github.repository.split('/');
              const { data: { artifacts } } = await oct.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: github.run_id });
              const artifact = artifacts.find((a: any) => a.name === artifactName);
              if (!artifact) { core.setFailed(`Artifact '${artifactName}' not found in run`); return; }
              const { data: zip } = await oct.rest.actions.downloadArtifact({ owner, repo, artifact_id: artifact.id, archive_format: 'zip' });
              archivePath = path.join(os.tmpdir(), 'site.zip');
              fs.writeFileSync(archivePath, Buffer.from(zip as ArrayBuffer));
              contentType = 'application/zip';
            } else {
              archivePath = path.join(os.tmpdir(), 'site.tar.gz');
              await exec.exec('tar', ['-czf', archivePath, '-C', sourceDir, '.']);
              contentType = 'application/gzip';
            }
            const size = fs.statSync(archivePath).size;
            core.info(`Archive size: ${size} bytes`);

            const target = `${sitesBase}/${project}/branch/${branch}`;
            const uploadHeaders: Record<string, string> = {
              'Authorization': `Bearer ${token}`,
              'Content-Type': contentType,
              'X-Git-Commit': gitCommit,
              'X-Public-Site': isPublic,
            };

            // Mirrors internal/uploadclient's DefaultChunkThreshold /
            // DefaultChunkSize. chunk_size 0 disables chunking (always direct).
            let chunkSize = 64 * 1024 * 1024;
            if (chunkSizeInput) {
              const n = Number(chunkSizeInput);
              if (!Number.isInteger(n) || n < 0) {
                core.setFailed(`invalid chunk_size '${chunkSizeInput}': expected a non-negative integer (bytes)`);
                return;
              }
              chunkSize = n === 0 ? -1 : n;
            }

            // The direct/chunked decision is made purely from the local
            // archive size plus the limit the server advertises -- never by
            // reacting to a failed oversized attempt (a proxy's body cap 413
            // never even reaches the origin). Any fetch/parse failure just
            // means the built-in default.
            let directLimit = 95 * 1024 * 1024;
            try {
              const infoResp = await fetch(`${server}/api/v1/server-info`);
              if (infoResp.ok) {
                const info = (await infoResp.json()) as { max_direct_upload_bytes?: number };
                if (typeof info.max_direct_upload_bytes === 'number' && info.max_direct_upload_bytes > 0) {
                  directLimit = info.max_direct_upload_bytes;
                }
              }
            } catch { /* capability probe only; the default always works */ }

            const blob = await fs.openAsBlob(archivePath);

            const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));

            // Buildhost runs behind a CDN/reverse proxy and is redeployed
            // with rolling updates. During a deploy window the edge can
            // briefly emit a transient 5xx, a connection error, or an
            // empty-body 404 (an origin/proxy 404 -- distinct from the app's
            // own 404, which always carries a JSON body). Retry those with
            // backoff so a buildhost deploy never hard-fails a publish. Any
            // 4xx that carries a body returns at once for the caller.
            const isTransient = (status: number, text: string): boolean =>
              status >= 500 || (status === 404 && text.trim() === "");

            const api = async (method: string, url: string, body?: Blob, headers?: Record<string, string>) => {
              const h: Record<string, string> = headers ?? { Authorization: `Bearer ${token}` };
              const maxAttempts = 5;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  const resp = await fetch(url, { method, headers: h, body });
                  const text = await resp.text();
                  if (attempt === maxAttempts || !isTransient(resp.status, text)) {
                    return { status: resp.status, text };
                  }
                  core.warning(`${method} ${url} -> HTTP ${resp.status} (transient; attempt ${attempt}/${maxAttempts}); retrying`);
                } catch (e) {
                  const msg = e instanceof Error ? e.message : String(e);
                  if (attempt === maxAttempts) {
                    return { status: 0, text: `request failed after ${maxAttempts} attempts: ${msg}` };
                  }
                  core.warning(`${method} ${url} -> ${msg} (network error; attempt ${attempt}/${maxAttempts}); retrying`);
                }
                await sleep(1000 * 2 ** (attempt - 1));
              }
              return { status: 0, text: "unreachable" };
            };

            // The archive's sha256, needed on both paths: the chunked finalize
            // verifies the assembled spool against it, and the artifact-metadata
            // storage record is keyed by it. One streaming read either way (the
            // TS action injects no `crypto` global; require is the documented
            // route to node modules).
            const crypto = require("crypto");
            const fileSHA256 = (p: string): Promise<string> => new Promise((resolve, reject) => {
              const hash = crypto.createHash("sha256");
              fs.createReadStream(p)
                .on("error", reject)
                .on("data", (chunk: Buffer) => hash.update(chunk))
                .on("end", () => resolve(hash.digest("hex")));
            });
            const sum = await fileSHA256(archivePath);

            // Recording what buildhost now stores is PART of publishing, not a
            // bolt-on: it happens in this step, has no opt-out input, and a
            // failure fails the publish. A warn-and-continue path would be an
            // opt-out by neglect -- the publish would stay green while the
            // org's linked artifacts page silently fell behind reality.
            // The endpoint's own response -- from the direct PUT or the
            // session finalize, same endpoint either way -- feeds the outputs.
            const finishPublish = async (r: { status: number; text: string }): Promise<void> => {
              if (r.status < 200 || r.status >= 300) { core.setFailed(`HTTP ${r.status}: ${r.text}`); return; }
              const body = JSON.parse(r.text);
              // Never derive this: the server owns the URL grammar and reports it.
              // The fallback is for servers predating that field -- keep it on the
              // canonical spelling, not the /branch/ one the upload endpoint uses.
              const siteURL: string =
                typeof body.url === 'string' && body.url !== ''
                  ? body.url
                  : `${sitesBase}/${project}/@${branch}/`;
              core.info(`Published site to ${siteURL}`);
              core.info(JSON.stringify(body, null, 2));
              core.setOutput('response', r.text);
              core.setOutput('site_url', siteURL);
              await recordSite(octokit, core, context, { server, project, branch, version: gitCommit, sha256: sum });
            };

            if (chunkSize <= 0 || size <= directLimit) {
              await finishPublish(await api('PUT', target, blob, uploadHeaders));
              return;
            }

            // --- Chunked upload session (mirrors buildhost-upload-artifact /
            // internal/uploadclient): assemble the archive server-side from
            // requests small enough to pass the proxy, then finalize the
            // ORIGINAL sites PUT by reference with an empty body. The sites
            // endpoint's own routing, auth, size caps, and Content-Type
            // dispatch all run unchanged against the assembled spool.

            // `sum` (the archive's sha256, used by the finalize's integrity
            // check) is computed above, since the record needs it on the
            // direct-upload path too.
            const create = await api('POST', `${server}/api/v1/uploads`);
            if (create.status === 404 || create.status === 405) {
              // Server predates upload sessions. Fall back to the classic
              // single request -- exactly what the old action sent -- with a
              // heads-up, since a proxy body cap may reject it.
              core.warning(`server does not support chunked uploads; sending ${size} bytes as a single request`);
              await finishPublish(await api('PUT', target, blob, uploadHeaders));
              return;
            }
            if (create.status !== 201) {
              core.setFailed(`create upload session failed: HTTP ${create.status}: ${create.text}`);
              return;
            }
            const sessionID = (JSON.parse(create.text) as { id?: string }).id ?? '';
            if (!sessionID) { core.setFailed('create upload session: bad response'); return; }
            const sessionURL = `${server}/api/v1/uploads/${sessionID}`;

            const abortSession = async () => {
              try {
                await fetch(sessionURL, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
              } catch { /* best effort */ }
            };

            // sessionSize reads the committed size for resuming after a hiccup.
            const sessionSize = async (): Promise<number> => {
              let lastErr = '';
              for (let attempt = 0; attempt < 4; attempt++) {
                if (attempt > 0) await sleep(1000 * 2 ** (attempt - 1));
                try {
                  const resp = await fetch(sessionURL, { headers: { Authorization: `Bearer ${token}` } });
                  const body = (await resp.json()) as { size?: number };
                  if (resp.status === 200 && typeof body.size === 'number') return body.size;
                  lastErr = `HTTP ${resp.status}`;
                } catch (e) {
                  lastErr = e instanceof Error ? e.message : String(e);
                }
              }
              throw new Error(`read upload session size: ${lastErr}`);
            };

            // appendChunk PATCHes one chunk and returns the server's
            // committed size. A 409 (offset conflict / busy) carries the
            // authoritative size; a transport error or 5xx resolves to a
            // status read -- either way the loop resumes from wherever the
            // server actually is, so a partially delivered chunk resumes
            // instead of restarting.
            const appendChunk = async (offset: number, chunk: Blob): Promise<number> => {
              let status: number;
              let text: string;
              try {
                const resp = await fetch(`${sessionURL}?offset=${offset}`, {
                  method: 'PATCH',
                  headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/octet-stream' },
                  body: chunk,
                });
                status = resp.status;
                text = await resp.text();
              } catch {
                // The chunk may have partially landed before the connection
                // broke; ask the server how much it has and resume from there.
                return sessionSize();
              }
              if (status === 200 || status === 409) {
                const body = JSON.parse(text) as { size?: number };
                if (typeof body.size !== 'number') throw new Error(`upload chunk at ${offset}: bad response`);
                return body.size;
              }
              if (status >= 500) return sessionSize();
              throw new Error(`upload chunk at ${offset} failed: HTTP ${status}: ${text}`);
            };

            const totalChunks = Math.ceil(size / chunkSize);
            core.info(`Uploading ${size} bytes in ${totalChunks} chunks of up to ${chunkSize} bytes`);

            try {
              let offset = 0;
              let failures = 0;
              while (offset < size) {
                const newOffset = await appendChunk(offset, blob.slice(offset, Math.min(offset + chunkSize, size)));
                if (newOffset <= offset) {
                  failures++;
                  if (failures >= 4) throw new Error(`upload session ${sessionID} made no progress at offset ${offset}`);
                  await sleep(1000 * 2 ** (failures - 1));
                } else {
                  failures = 0;
                  core.info(`  chunk ${Math.ceil(newOffset / chunkSize)}/${totalChunks} uploaded (${newOffset}/${size} bytes)`);
                }
                offset = newOffset;
              }
            } catch (e) {
              await abortSession();
              core.setFailed(e instanceof Error ? e.message : String(e));
              return;
            }

            // Finalize: the original sites PUT with an empty body, referencing
            // the session and the archive's sha256 (verified server-side
            // against the assembled spool before the sites endpoint ever
            // runs). The X-Git-Commit / X-Public-Site headers and Content-Type
            // ride on this request exactly as they would on a direct upload.
            const fin = await api('PUT', `${target}?upload_session=${sessionID}&upload_sha256=${sum}`, undefined, uploadHeaders);
            if (fin.status < 200 || fin.status >= 300) {
              // The server keeps a session on a failed finalize (for
              // retries); ours are exhausted, so don't leave the spool for
              // the TTL sweeper.
              await abortSession();
            }
            await finishPublish(fin);
          })();

    # Terminal status for the GitHub Deployment created above; runs even when
    # the publish failed so the deployment is marked failure instead of
    # dangling in_progress. Never fails the action.
    - name: Finish GitHub Deployment
      id: deployment-status
      if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            try {
              const publishOutcome: string = "${{ steps.publish.outcome }}";
              const ok = publishOutcome === 'success';
              const environmentUrl: string = "${{ steps.publish.outputs.site_url }}";
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
                state: ok ? 'success' : 'failure',
                log_url: runUrl,
                ...(ok && environmentUrl !== '' ? { environment_url: environmentUrl } : {}),
                description: ok ? 'Site published to buildhost' : 'buildhost site publish failed',
              });
              core.info(`GitHub Deployment marked ${ok ? 'success' : 'failure'}`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not post the terminal GitHub Deployment status (${msg}); the deployment would be left stuck in_progress`);
            }
          })();
