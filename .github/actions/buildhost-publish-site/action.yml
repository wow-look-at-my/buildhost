name: Buildhost - Publish Site
version: 2
description: >
  Publish a static site to a Buildhost registry branch. The upload strategy is
  picked from the server's advertised limits before anything is sent
  (GET /api/v1/server-info): archives at or under max_direct_upload_bytes go as
  the classic single PUT, larger ones go through a chunked upload session --
  so sites over a proxy's request-body cap (Cloudflare's edge rejects single
  requests over ~100 MB) publish instead of dying with a 413.

inputs:
  server:
    description: 'Buildhost server URL (apex; the sites subdomain is derived from it)'
    required: false
    default: 'https://pazer.build'
  token:
    description: 'API token with write scope, or omit to use OIDC'
    required: false
    default: ''
  project:
    description: 'Project name (defaults to the repository name)'
    required: false
    default: ''
  branch:
    description: >-
      Branch name to publish the site under. The sites router serves a site
      under ONE path segment, so anything outside [A-Za-z0-9._-] is flattened
      to `-` here: buildhost owns the URL grammar, and a caller passing
      `github.ref_name` gets a working site instead of a 404.
    required: true
  source_dir:
    description: 'Local directory to publish (mutually exclusive with artifact_name)'
    required: false
    default: ''
  artifact_name:
    description: 'GHA run artifact name to download and publish (mutually exclusive with source_dir)'
    required: false
    default: ''
  git_commit:
    description: 'Git commit SHA (defaults to github.sha)'
    required: false
    default: ''
  deployment_ref:
    description: >-
      Ref the GitHub Deployment is created against (defaults to git_commit, then
      github.sha). Pass a BRANCH NAME to make the publish appear in the branch
      and PR deployment views: GitHub stores this string verbatim, and a
      deployment whose ref is a bare SHA belongs to no branch, so those views
      read "This branch has not been deployed". A branch here still fills the
      deployment's `sha` (GitHub resolves it), so the commit-level association
      survives. Separate from git_commit because that one is the site's recorded
      commit (X-Git-Commit) and has to stay a real SHA.
    required: false
    default: ''
  public:
    description: 'Serve the site publicly even when the source repo/project is private. The project itself (and any release artifacts) stays private; only this site branch is opened.'
    required: false
    default: 'false'
  chunk_size:
    description: >-
      Chunk size in bytes for large uploads (default 64 MiB, like the CLI's
      --chunk-size); 0 disables chunking entirely (always one direct request)
    required: false
    default: ''
  deployment_environment:
    description: >-
      GitHub Deployment environment name (defaults to
      `buildhost/<project>/<branch>`).
    required: false
    default: ''
  comment:
    description: >-
      Hand the published site URL to the open pull request for this branch, as
      one sticky comment per project and site branch. On by default: a preview
      nobody is handed is a preview nobody opens. The job must grant
      `pull-requests: write`. Set false where a repository deliberately does
      not want the link posted.
    required: false
    default: true

outputs:
  response:
    description: 'JSON response from the API'
    value: ${{ steps.publish.outputs.response }}
  site_url:
    description: 'URL of the published site'
    value: ${{ steps.publish.outputs.site_url }}

runs:
  using: composite
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    # Registering the site publish as a GitHub Deployment is part of publishing,
    - name: Create GitHub Deployment
      id: deployment
      uses: wow-look-at-my/actions@typescript#latest
      with:
        inputs: ${{ toJSON(inputs) }}
        script: |
          import { createSiteDeployment } from '../lib/deployment';
          await createSiteDeployment({ core, github, context, octokit, getOctokit, exec, inputs, steps });

    - id: publish
      uses: wow-look-at-my/actions@typescript#latest
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        inputs: ${{ toJSON(inputs) }}
        script: |
          import { publishSite } from '../lib/site';
          await publishSite({ core, github, context, octokit, getOctokit, exec, inputs, steps });

    # Terminal status for the GitHub Deployment created above; runs even when
    - name: Finish GitHub Deployment
      id: deployment-status
      if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        inputs: ${{ toJSON(inputs) }}
        steps: ${{ toJSON(steps) }}
        script: |
          import { finishSiteDeployment } from '../lib/deployment';
          await finishSiteDeployment({ core, github, context, octokit, getOctokit, exec, inputs, steps });
