name: Build and publish docker image to Buildhost
version: 4
description: >
  Build a Docker image with buildx and push it to a buildhost OCI registry in a
  single step, authenticating with a GitHub Actions OIDC token (no static
  secret). The project auto-provisions on first push. The same OIDC identity
  logs docker in before the build, so a Dockerfile can be `FROM` an image this
  registry already holds without the caller adding a login step. Buildhost-bound pushes go
  through the `buildhost docker-push` CLI, which uploads blobs in chunks sized
  under the server's advertised request-body limit -- so layers over the
  Cloudflare ~100 MB edge cap publish instead of dying with a 413 (docker/buildx
  send each layer as one request). Tags that reference other registries are
  still pushed with buildx as before.

inputs:
  server:
    description: 'Buildhost server URL (used as the OIDC audience; its host is the registry).'
    required: false
    default: 'https://pazer.build'
  project:
    description: 'Image name on buildhost (defaults to the repository name).'
    required: false
    default: ''
  context:
    description: 'Docker build context.'
    required: false
    default: '.'
  file:
    description: 'Path to the Dockerfile (defaults to {context}/Dockerfile).'
    required: false
    default: ''
  tags:
    description: >
      Newline-separated image tags. A bare tag (e.g. "latest" or a commit SHA)
      is expanded to <registry>/<project>:<tag>; a value containing "/" or ":"
      is used as a full image reference (so you can also push to another
      registry you have already logged in to). When omitted, defaults to the
      commit SHA plus the docker-sanitized ref name (branch or git tag:
      lowercased, runs of characters outside [a-z0-9._-] become "-", leading
      dots/dashes stripped -- so "claude/foo" pushes as "claude-foo", a bare
      buildhost tag, never a foreign reference), and "latest" ONLY when the
      push is to the repository's default branch -- pushed OCI tags are
      mutable pointers, so a feature-branch push must not move the :latest
      ref that stable consumers track. (The default branch is read from the
      event payload; events without one, e.g. schedule, fall back to
      "master" and so never add "latest" on a "main"-defaulted repo.)
    required: false
    default: ''
  platforms:
    description: 'Comma-separated build platforms (e.g. linux/amd64,linux/arm64).'
    required: false
    default: ''
  build-args:
    description: 'Newline-separated build args (KEY=value).'
    required: false
    default: ''
  labels:
    description: 'Newline-separated image labels. OCI revision/source labels are added automatically.'
    required: false
    default: ''
  provenance:
    description: 'buildx provenance attestations.'
    required: false
    default: 'false'
  cache:
    description: 'Use the GitHub Actions layer cache (type=gha).'
    required: false
    default: 'true'
  push:
    description: 'Push to the registry (set false to build only).'
    required: false
    default: 'true'
  compression:
    description: >
      Layer compression: zstd (default), gzip, estargz or uncompressed. zstd
      compresses smaller and decompresses several times faster than gzip, and
      buildhost's own synthesized images have always used it -- buildx's gzip
      default was the only reason published images differed. Consumers need an
      OCI-aware puller: Docker's containerd image store (the default for Engine
      29.0+ on fresh installs, `features.containerd-snapshotter` before that),
      containerd, podman, or go-containerregistry. Set gzip only for a consumer
      pinned to Docker's classic image store.
    required: false
    default: 'zstd'
  compression-level:
    description: 'Compression level (zstd 0-22, gzip/estargz 0-9). Empty uses the algorithm default.'
    required: false
    default: ''
  force-compression:
    description: >
      Re-compress layers that arrive already compressed -- from a cache hit or
      a base image built with a different algorithm. Without it a `FROM` base
      keeps its original layers and the image ships mixed compression.
    required: false
    default: 'true'
  verify:
    description: >
      After pushing, pull each buildhost reference back and check its recorded
      revision. On by default: a push that cannot be pulled is not a publish,
      and finding that out here beats finding it out from a consumer.
    required: false
    default: 'true'
  deployment_environment:
    description: >-
      GitHub Deployment environment name (defaults to `buildhost/<project>`).
    required: false
    default: ''
  deployment_ref:
    description: >-
      Ref the GitHub Deployment is created against (defaults to GITHUB_SHA).
      Pass a BRANCH NAME to make the publish appear in the branch and PR
      deployment views: GitHub stores this string verbatim, and a deployment
      whose ref is a bare SHA belongs to no branch, so those views read "This
      branch has not been deployed". A branch here still fills the deployment's
      `sha` (GitHub resolves it), so the commit-level association survives.
      See docs/github-deployments.md.
    required: false
    default: ''

outputs:
  image:
    description: 'The primary pushed image reference (the first tag).'
    value: ${{ steps.refs.outputs.primary }}
  digest:
    description: 'The image digest reported by buildx.'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    # Registering the image publish as a GitHub Deployment is part of
    # publishing, not an add-on: no opt-out input, and a failure fails the step.
    # See buildhost-publish for why warn-and-continue was removed. Still skipped
    # for build-only runs -- `push != 'true'` publishes nothing, so there is
    # nothing to deploy; that is a property of the run, not a switch. The calling
    # job needs `deployments: write` (ADDITIVE -- a job-level permissions block
    # replaces the workflow-level one).
    - name: Create GitHub Deployment
      id: deployment
      if: ${{ inputs.push == 'true' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            core.setOutput('deployment_id', '');
            const deployServer: string = "${{ inputs.server }}";
            const deployHost: string = new URL(deployServer).hostname;
            // this check finds a target nothing outside the runner can reach
            if (deployHost === "localhost" || deployHost === "127.0.0.1" || deployHost === "::1" || !deployServer.startsWith("https://")) {
              // a loopback or plain-http target has nothing true to register as live
              core.info(`Skipping the GitHub Deployment: ${deployServer} is not a reachable https server, so its deployment URL would point nowhere`);
              return;
            }
            try {
              const projectInput: string = "${{ inputs.project }}";
              const project: string = projectInput || github.repository.split('/').pop()!;
              const envInput: string = "${{ inputs.deployment_environment }}";
              const environment: string = envInput || `buildhost/${project}`;
              const defaultBranch: string = context.payload.repository?.default_branch ?? '';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const deploymentRefInput: string = "${{ inputs.deployment_ref }}";
              // a bare SHA belongs to no branch, so GitHub's branch/PR deployment views show it as never deployed -- pass a branch name here to fix that
              const ref: string = deploymentRefInput || context.sha;
              // every publish to a real server registers -- there's no opt-out
              const dep = await octokit.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                environment,
                // the API default would try to merge the default branch into ref
                auto_merge: false,
                // the API default is "every commit status", and the org's all-builds status is still pending on this sha mid-run -> 409 Conflict
                required_contexts: [],
                transient_environment: false,
                production_environment: defaultBranch !== '' && context.ref === `refs/heads/${defaultBranch}`,
                description: `buildhost docker publish of ${project}`.slice(0, 140),
              });
              const id = (dep.data as any)?.id;
              // a 2xx response without an id (e.g. the 202 auto-merge shape) counts as no deployment
              if (typeof id !== 'number') {
                core.setFailed(`GitHub Deployment not created (HTTP ${dep.status}): the API returned no deployment id`);
                return;
              }
              core.setOutput('deployment_id', String(id));
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: id,
                state: 'in_progress',
                log_url: runUrl,
                description: 'Publishing Docker image to buildhost',
              });
              core.info(`Created GitHub Deployment ${id} in environment '${environment}'`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not create the GitHub Deployment (${msg}). Add 'deployments: write' to this job's permissions block -- job-level permissions REPLACE workflow-level ones, so add it alongside the ones the job already declares. Registering the publish is part of publishing and cannot be turned off.`);
            }
          })();

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Pushing does not need a docker login -- `buildhost docker-push` carries
    # its own OIDC token -- but BUILDING can: a Dockerfile whose FROM is one of
    # this registry's own images makes buildx pull that base, and an
    # unauthenticated pull of a private project is a 401. Logging in here is
    # what keeps "build an image FROM an image you published" a single step
    # instead of a login every caller has to remember.
    - name: Log in to the buildhost registry (for private FROM bases)
      shell: bash
      run: bash "${{ github.action_path }}/docker-login.sh" "${{ inputs.server }}"

    # When `tags` is omitted, compute branch-aware defaults instead of an
    # unconditional "SHA + latest": pushed OCI tags are mutable pointers
    # (resolved before buildhost's default-branch fallback), so defaulting
    # `latest` everywhere would let any feature-branch push hijack the stable
    # :latest ref consumers track (e.g. a docker-updater re-pulling it).
    - name: Compute default tags
      id: default-tags
      if: ${{ inputs.tags == '' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          // mirrors GITHUB_REF_NAME: the branch for refs/heads/*, the git tag for refs/tags/*, "<pr>/merge" for pulls
          const refName: string = env.GITHUB_REF_NAME ?? context.ref.replace(/^refs\/[^/]+\//, "");
          const defaultBranch: string = context.payload.repository?.default_branch ?? "master";
          // docker-sanitized so the result is always a bare buildhost-bound tag, e.g. "claude/foo" -> "claude-foo", never a foreign reference
          const refTag = refName.toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^[.-]+/, "");
          const tags = [context.sha, refTag].filter(Boolean);
          if (context.ref === `refs/heads/${defaultBranch}`) tags.push("latest");
          core.setOutput("tags", tags.join("\n"));
          core.info(`tags input omitted; defaulting to: ${tags.join(", ")}`);

    - name: Resolve image references
      id: refs
      shell: bash
      env:
        SERVER: ${{ inputs.server }}
        PROJECT: ${{ inputs.project }}
        TAGS: ${{ inputs.tags }}
        DEFAULT_TAGS: ${{ steps.default-tags.outputs.tags }}
        EXTRA_LABELS: ${{ inputs.labels }}
        CACHE: ${{ inputs.cache }}
        PUSH: ${{ inputs.push }}
        COMPRESSION: ${{ inputs.compression }}
        COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        FORCE_COMPRESSION: ${{ inputs.force-compression }}
      run: |
        set -euo pipefail
        # The OCI registry is served on the oci.<domain> subdomain.
        registry="${SERVER#*://}"; registry="${registry%%/*}"; registry="oci.${registry}"
        project="${PROJECT:-${GITHUB_REPOSITORY##*/}}"

        if [ -n "${TAGS}" ]; then
          tags_in="${TAGS}"
        else
          tags_in="${DEFAULT_TAGS}"
        fi

        # Split references into buildhost-bound ones (pushed by the chunk-aware
        # `buildhost docker-push` CLI) and foreign ones (pushed by buildx).
        refs=""
        buildhost_refs=""
        foreign_refs=""
        while IFS= read -r line; do
          tag="$(printf '%s' "${line}" | tr -d '[:space:]')"
          [ -z "${tag}" ] && continue
          case "${tag}" in
            */*|*:*) ref="${tag}" ;;                       # full reference, used verbatim
            *)       ref="${registry}/${project}:${tag}" ;; # bare tag -> buildhost ref
          esac
          refs="${refs}${ref}"$'\n'
          case "${ref}" in
            "${registry}/"*) buildhost_refs="${buildhost_refs}${ref}"$'\n' ;;
            *)               foreign_refs="${foreign_refs}${ref}"$'\n' ;;
          esac
        done <<< "${tags_in}"

        # Compression rides the exporter, not a build-push-action input, so it has to be spelled into every output form.
        # force-compression is what applies it to layers inherited from a base or a cache hit, not only to newly built ones.
        compression="compression=${COMPRESSION},force-compression=${FORCE_COMPRESSION}"
        [ -n "${COMPRESSION_LEVEL}" ] && compression="${compression},compression-level=${COMPRESSION_LEVEL}"

        layout="${RUNNER_TEMP}/buildhost-oci-layout"
        if [ -n "${buildhost_refs}" ]; then
          # exported for the chunk-aware CLI to push; never pushed by buildx
          build_outputs="type=oci,tar=false,dest=${layout},${compression}"
        else
          build_outputs="type=image,push=${PUSH},${compression}"
        fi

        {
          echo "registry=${registry}"
          echo "primary=$(printf '%s' "${refs}" | head -n1)"
          echo "layout=${layout}"
          echo "compression_opts=${compression}"
          echo "build_outputs=${build_outputs}"
          echo "tags<<__TAGS__"; printf '%s' "${refs}"; echo "__TAGS__"
          echo "buildhost_refs<<__BH__"; printf '%s' "${buildhost_refs}"; echo "__BH__"
          echo "foreign_refs<<__FOREIGN__"; printf '%s' "${foreign_refs}"; echo "__FOREIGN__"
          echo "labels<<__LABELS__"
          printf '%s\n' "org.opencontainers.image.revision=${GITHUB_SHA}" \
                        "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          [ -n "${EXTRA_LABELS}" ] && printf '%s\n' "${EXTRA_LABELS}"
          echo "__LABELS__"
          if [ "${CACHE}" = "true" ]; then
            echo "cache_from=type=gha"
            echo "cache_to=type=gha,mode=max"
          fi
        } >> "${GITHUB_OUTPUT}"

    # When any tag targets buildhost, the build EXPORTS an OCI layout instead of
    # pushing: docker/buildx upload every blob as one request, which the proxy in
    # front of a deployed buildhost rejects for layers over ~100 MB (Cloudflare
    # edge 413). The chunk-aware CLI below pushes the layout instead. A run whose
    # tags are all foreign (or push=false) keeps the old buildx behavior exactly.
    - name: Build and push
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        outputs: ${{ steps.refs.outputs.build_outputs }}
        platforms: ${{ inputs.platforms }}
        provenance: ${{ inputs.provenance }}
        tags: ${{ steps.refs.outputs.tags }}
        labels: ${{ steps.refs.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ steps.refs.outputs.cache_from }}
        cache-to: ${{ steps.refs.outputs.cache_to }}

    - name: Push to buildhost (chunked)
      id: push-buildhost
      if: ${{ inputs.push == 'true' && steps.refs.outputs.buildhost_refs != '' }}
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-docker-push@master
      with:
        server: ${{ inputs.server }}
        image: ${{ steps.refs.outputs.layout }}
        refs: ${{ steps.refs.outputs.buildhost_refs }}

    # Tags that reference other registries keep the old buildx push path; the
    # rebuild is a full cache hit from the step above.
    - name: Push non-buildhost references
      id: push-foreign
      if: ${{ inputs.push == 'true' && steps.refs.outputs.buildhost_refs != '' && steps.refs.outputs.foreign_refs != '' }}
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        outputs: type=image,push=true,${{ steps.refs.outputs.compression_opts }}
        platforms: ${{ inputs.platforms }}
        provenance: ${{ inputs.provenance }}
        tags: ${{ steps.refs.outputs.foreign_refs }}
        labels: ${{ steps.refs.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ steps.refs.outputs.cache_from }}

    # Publishing is not finished until the image can be PULLED back. This lives
    # here rather than in every caller's workflow: the action knows the refs it
    # pushed, and the credential is short-lived, so the login belongs next to
    # the pull -- a long build outlives a token minted before it.
    - name: Verify the published image pulls
      id: verify
      if: ${{ inputs.push == 'true' && inputs.verify == 'true' && steps.refs.outputs.buildhost_refs != '' }}
      shell: bash
      env:
        REFS: ${{ steps.refs.outputs.buildhost_refs }}
      run: |
        set -euo pipefail
        bash "${{ github.action_path }}/docker-login.sh" "${{ inputs.server }}"
        while IFS= read -r ref; do
          [ -z "${ref}" ] && continue
          docker image rm "${ref}" >/dev/null 2>&1 || true
          docker pull "${ref}"
          revision="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${ref}")"
          if [ "${revision}" != "${GITHUB_SHA}" ]; then
            echo "::error::${ref} pulled with revision ${revision}, expected ${GITHUB_SHA}"
            exit 1
          fi
          echo "verified ${ref} (revision ${revision})"
        done <<< "${REFS}"

    # Terminal status for the GitHub Deployment created above; runs even when
    # a publish step failed so the deployment is marked failure instead of
    # dangling in_progress. Never fails the action.
    - name: Finish GitHub Deployment
      id: deployment-status
      if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          await (async () => {
            try {
              const server: string = "${{ inputs.server }}";
              const projectInput: string = "${{ inputs.project }}";
              const project: string = projectInput || github.repository.split('/').pop()!;
              // a failure before the build (refs, or buildx setup) leaves this 'skipped', which must not count as success below
              const buildOutcome: string = "${{ steps.build.outcome }}";
              const outcomes: string[] = [
                "${{ steps.refs.outcome }}",
                buildOutcome,
                "${{ steps.push-buildhost.outcome }}",
                "${{ steps.push-foreign.outcome }}",
              ];
              // 'skipped' push steps are fine -- which ones ran depends on which registries the tags target
              const ok = buildOutcome === 'success' && outcomes.every((o) => o !== 'failure' && o !== 'cancelled');
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await octokit.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
                state: ok ? 'success' : 'failure',
                log_url: runUrl,
                ...(ok ? { environment_url: `${server}/projects/${project}` } : {}),
                description: ok ? 'Docker image published to buildhost' : 'buildhost docker publish failed',
              });
              core.info(`GitHub Deployment marked ${ok ? 'success' : 'failure'}`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.setFailed(`Could not post the terminal GitHub Deployment status (${msg}); the deployment would be left stuck in_progress`);
            }
          })();
