name: Buildhost - Create Release
description: Creates a release for a project in a Buildhost registry.

inputs:
  server:
    description: 'Buildhost server URL'
    required: false
    default: 'https://pazer.build'
  token:
    description: 'API token with write scope, or omit to use OIDC'
    required: false
    default: ''
  project:
    description: 'Project name'
    required: true
  version:
    description: 'Version string (omit for auto-versioned projects)'
    required: false
    default: ''
  git_branch:
    description: 'Git branch (defaults to github.ref_name)'
    required: false
    default: ''
  git_commit:
    description: 'Git commit SHA (defaults to github.sha)'
    required: false
    default: ''
  notes:
    description: 'Release notes'
    required: false
    default: ''
  create_service:
    description: >-
      Declare that the project's installed binary runs as a background
      service ('true' or 'false'); each download format materializes it its
      own way (brew formulas gain a `service do` block, on-the-fly debs ship
      a systemd user unit). Empty (the default) sends nothing, leaving the
      stored project setting untouched -- byte-identical request to before
      this input existed.
    required: false
    default: ''
  default_branch:
    description: >-
      The repo's default branch (e.g. 'main'). When set, the apex "latest"
      tracks this branch for the project -- a manual override for publishers
      whose default branch the server cannot learn itself (private repos it
      cannot reach, non-GitHub publishers). Empty (the default) sends
      nothing, leaving the stored project setting untouched -- byte-identical
      request to before this input existed.
    required: false
    default: ''
  apt_depends:
    description: >-
      The project's runtime prerequisites in Debian relationship syntax (e.g.
      'bubblewrap | docker.io'). The generated deb and the APT Packages entry
      carry it as a Depends field. The server refuses an invalid value, and
      the step fails. Empty (the default) sends nothing and leaves the stored
      value untouched. Clear it with PATCH /api/v1/projects/{project}.
    required: false
    default: ''

outputs:
  response:
    description: 'JSON response from the API'
    value: ${{ steps.create.outputs.response }}
  version:
    description: 'Assigned release version'
    value: ${{ steps.create.outputs.version }}

runs:
  using: composite
  steps:
    - id: create
      uses: wow-look-at-my/actions@typescript#latest
      with:
        inputs: ${{ toJSON(inputs) }}
        file: ${{ github.action_path }}/../lib/steps/create-release-create.ts
